<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing Mustache</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        background: #e6b619;
        overflow: hidden;
      }
      .scene {
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        position: fixed;
        display: none;
      }
      .cowboy {
        height: 50vmin;
        width: 50vmin;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .cowboy__hat--main {
        fill: #8a610f;
      }
      .cowboy__hat--brim {
        fill: #5c470a;
      }
      .cowboy__brow {
        stroke: #0d0d0d;
      }
      .cowboy__pupil {
        fill: #fff;
      }
      .cowboy__eye-main {
        fill: #0d0d0d;
      }
      .cowboy__lip {
        stroke: #0d0d0d;
      }
      .cowboy__tongue {
        fill: #ff2b00;
      }
      .cowboy__mouth {
        fill: #000;
      }
      .cowboy__teeth {
        fill: #fff;
      }
      .cowboy__face {
        height: 100%;
        width: 100%;
      }
      .cowboy__stache {
        fill: #0d0d0d;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30vmin;
        transform: translate(-50%, 30%);
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="cowboy">
        <svg
          class="cowboy__face"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewbox="0 0 520 507"
        >
          <defs>
            <clippath id="mouth">
              <path
                d="M331 364c0 29.823-29.459 69-69.5 69S187 393.823 187 364c0 0 34.459 15 74.5 15s69.5-15 69.5-15z"
              ></path>
            </clippath>
          </defs>
          <g class="cowboy__eye">
            <circle
              class="cowboy__eye-main"
              cx="208.263"
              cy="289.236"
              r="15.737"
            ></circle>
            <circle
              class="cowboy__pupil"
              cx="208.263"
              cy="282.083"
              r="4.292"
            ></circle>
          </g>
          <path
            class="cowboy__brow"
            d="M188 292.307C204.066 283.909 213.074 284.311 229.14 292.307"
            stroke-width="8"
            stroke-linecap="round"
          ></path>
          <g class="cowboy__eye">
            <circle
              class="cowboy__eye-main"
              cx="307.123"
              cy="289.236"
              r="16.877"
            ></circle>
            <circle
              class="cowboy__pupil"
              cx="307.123"
              cy="281.565"
              r="4.603"
            ></circle>
          </g>
          <path
            class="cowboy__brow"
            d="M286.86 292.307C302.926 283.909 311.934 284.311 328 292.307"
            stroke-width="8"
            stroke-linecap="round"
          ></path>
          <path
            class="cowboy__hat--main"
            d="M161.5 1.519C169.511-3.99 235 11.019 261 18c38-6.981 86.262-20.975 94.5-16.481 16.5 9 45.5 207 45.5 207H114s31.5-196 47.5-207z"
          ></path>
          <path
            class="cowboy__hat--brim"
            d="M7.5 96.5c20-6 1.5 65.781 223.5 79.5 222 13.719 259.5-75 283.5-74s-37 99-93.5 115-259 16-337-10S-12.5 102.5 7.5 96.5z"
          ></path>
          <path
            class="cowboy__mouth"
            d="M331 364c0 29.823-29.459 69-69.5 69S187 393.823 187 364c0 0 34.459 15 74.5 15s69.5-15 69.5-15z"
          ></path>
          <path
            class="cowboy__lip"
            stroke-linecap="round"
            stroke-width="6"
            d="M343 355s-35.23 22-82.5 22-87.5-22-87.5-22"
          ></path>
          <g clip-path="url(#mouth)">
            <path class="cowboy__teeth" d="M179 344h158v55H179z"></path>
            <circle class="cowboy__tongue" cx="270" cy="436" r="26"></circle>
          </g>
        </svg>
        <svg class="stache cowboy__stache" viewBox="5 6 10 4">
          <path
            class="stache__path"
            d="M 5 10 C 5 8 5 7 7 7 M 7 7 L 7 7 Q 8 5 9 7 L 13 7 C 15 7 15 8 15 10 C 14 9 14 9 13 9 L 9 9 Q 8 7 7 9 L 7 9 C 6 9 6 9 5 10z"
          ></path>
        </svg>
      </div>
    </div>

    <script type="module">
      import gsap from "https://esm.sh/gsap";

      const { ticker } = gsap;

      const CONFIG = {
        M1: 5,
        M2: 10,
        // M2: 6,
        C1: 8,
        // C1: 6,
        C2: 5,
        // C2: 6,
        CTHREE: 5,
        // CTHREE: 5,
        Q2: 7,
        QTWO2: 9,
        L1: 7,
        Q1: 8,
        Q3: 9,
        SHIFTER: 0,
        BUMPER: 0,
        LTWO: 9,
        QTWO1: 8,
        QTHREE3: 7,
        CTWO1: 14,
        // CTWO1: 14,
        CTWO2: 7,
        // CTWO2: 6,
        CTWO3: 10,
        // CTWO3: 6,
        CTHREE1: 15,
        // CTHREE1: 15,
        CTHREE2: 14,
        // CTHREE1: 15,
      };

      let POINTER = {
        x: 0,
        y: 0,
      };

      const getPath = () =>
        `M ${CONFIG.M1} ${CONFIG.M2}
        C 5 ${CONFIG.C1} ${CONFIG.C2} 7 7 7
        M 7 7
        L ${CONFIG.L1 + CONFIG.SHIFTER} 7
        Q ${CONFIG.Q1 + CONFIG.SHIFTER} ${CONFIG.Q2 - CONFIG.BUMPER} ${
          CONFIG.Q3 + CONFIG.SHIFTER
        } 7
        L 13 7
        C ${CONFIG.CTWO1} 7 15 ${CONFIG.CTWO2} 15 ${CONFIG.CTWO3}
        C ${CONFIG.CTHREE1} 9 ${CONFIG.CTHREE2} 9 13 9
        L ${CONFIG.LTWO + CONFIG.SHIFTER} 9
        Q ${CONFIG.QTWO1 + CONFIG.SHIFTER} ${
          CONFIG.QTWO2 - CONFIG.BUMPER
        } ${CONFIG.QTHREE3 + CONFIG.SHIFTER} 9
        L 7 9
        C 6 9 ${CONFIG.CTHREE} 9 5 ${CONFIG.M2}`;

      const pathSet = gsap.quickSetter(".stache__path", "attr");

      const BOUNDS = 50;

      const update = () => {
        const xPercent = gsap.utils.mapRange(
          0,
          window.innerWidth,
          -BOUNDS,
          BOUNDS,
          POINTER.x,
        );

        const yPercent = gsap.utils.mapRange(
          0,
          window.innerHeight,
          -BOUNDS,
          BOUNDS,
          POINTER.y,
        );

        gsap.set(".cowboy__pupil", { xPercent, yPercent });
        pathSet({ d: getPath() });
      };

      ticker.add(update);

      gsap.set(".cowboy__brow", {
        yPercent: -500,
      });

      gsap.set(".cowboy__eye", {
        transformOrigin: "50% 50%",
      });

      // let blinkTween
      const BLINK = () => {
        const delay = gsap.utils.random(1, 5);
        gsap.to(".cowboy__eye", {
          delay,
          scaleY: 0.1,
          repeat: 3,
          yoyo: true,
          duration: 0.05,
          onComplete: () => {
            BLINK();
          },
        });
      };
      BLINK();

      document.addEventListener("pointermove", ({ x, y }) => {
        POINTER = { x, y };
      });

      // const STACHE_TL =
      gsap
        .timeline({
          repeat: -1,
          yoyo: true,
        })
        .to(CONFIG, {
          M2: 6,
          C1: 6,
          C2: 6,
          repeat: 1,
          duration: 1,
          yoyo: true,
        })
        .to(
          CONFIG,
          {
            BUMPER: 1,
          },

          ">-0.6",
        )
        .to(CONFIG, {
          SHIFTER: 4,
        })
        .to(CONFIG, {
          BUMPER: 0,
        })
        .to(
          CONFIG,
          {
            CTWO1: 14,
            CTWO2: 6,
            CTWO3: 6,
            CTHREE1: 15,
            CTHREE2: 15,
            duration: 1,
            repeat: 1,
            yoyo: true,
          },

          ">-0.6",
        )
        .timeScale(3);

      gsap.set(".scene", { display: "flex" });
    </script>
  </body>
</html>
