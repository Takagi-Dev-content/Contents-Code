<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Birthday Cake v3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.2/TweenMax.min.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cookie&family=Rouge+Script&display=swap");

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(255, 255, 255);
        background-position:
          0 0,
          30px 30px;
        height: 100vh;
        overflow: hidden;
      }

      #cake {
        max-width: 300px;
      }

      #flame-left,
      #flame-right {
        display: none;
        transform-origin: 50% 50%;
      }

      #candle {
        transform-origin: 50% 40%;
        scale: 1.5;
      }

      .text{
        position: fixed;
        top: 40px;
        font-family: "Cookie", cursive;
        font-size: clamp(3rem, 5vw, 5rem);
        font-weight: 300;
        color: #444;
        text-align: center;
        scale: 0;
        animation: text-fade-in forwards 0.7s;
        animation-delay: 5.1s;
      }

      @keyframes text-fade-in{
        to{
          scale: 1
        }
      }

      /* ---------- Hearts around the candle ---------- */

      #hearts {
        opacity: 0;
        pointer-events: none; /* never block clicks/taps */
        animation: heartsFadeIn 1s ease-out forwards;
        animation-delay: 4.5s; /* appears right as the candle lights */
      }

      @keyframes heartsFadeIn {
        to { opacity: 1; }
      }

      .heart-anim {
        transform-box: fill-box;
        transform-origin: center;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }

      /* Three gentle float patterns, shared across hearts so each one
         feels a little different (direction, tilt, size pulse). */
      @keyframes heartFloatA {
        0%, 100% { transform: translate(0, 0) rotate(-6deg) scale(2); opacity: 0.55; }
        50%      { transform: translate(3px, -9px) rotate(5deg) scale(3); opacity: 0.9; }
      }
      @keyframes heartFloatB {
        0%, 100% { transform: translate(0, 0) rotate(5deg) scale(3); opacity: 0.6; }
        50%      { transform: translate(-4px, -11px) rotate(-6deg) scale(4); opacity: 0.85; }
      }
      @keyframes heartFloatC {
        0%, 100% { transform: translate(0, 0) rotate(-3deg) scale(2.5); opacity: 0.5; }
        50%      { transform: translate(2px, -7px) rotate(4deg) scale(3.5); opacity: 0.8; }
      }

      .heart-1 { animation-name: heartFloatA; animation-duration: 4.2s; animation-delay: 0.1s; }
      .heart-2 { animation-name: heartFloatB; animation-duration: 5.0s; animation-delay: 0.6s; }
      .heart-3 { animation-name: heartFloatC; animation-duration: 4.7s; animation-delay: 0.3s; }
      .heart-4 { animation-name: heartFloatA; animation-duration: 5.4s; animation-delay: 0.9s; }
      .heart-5 { animation-name: heartFloatB; animation-duration: 4.5s; animation-delay: 0s;   }
      .heart-6 { animation-name: heartFloatC; animation-duration: 5.1s; animation-delay: 0.5s; }
    </style>
  </head>

                <use href="#tinyHeart" fill="#F38AE5" />

            <g transform="translate(325,42) scale(1.3)">

              </g>

              </g>
            </g>

              </g>

    <script>
      const bottom = $("#bottomLayer");
      const middle = $("#middleLayer");
      const topLayer = $("#topLayer");
      const candle = $("#candle");
      const flameL = $("#flame-left");
      const flameR = $("#flame-right");
      const boop = $("#frosting-boop");
      const tl = new TimelineLite();

      tl.fromTo(
        bottom,
        1.5,
        {
          attr: { transform: "translate(0,-1000) rotate(-45)" },
          ease: Power1.easeIn,
        },
        {
          attr: { transform: "translate(0,326) rotate(0)" },
          ease: Power1.easeIn,
        },
      )
        .fromTo(
          middle,
          1.5,
          {
            attr: { transform: "translate(0,-1000) rotate(45)" },
            ease: Power1.easeIn,
          },
          {
            attr: { transform: "translate(0,245) rotate(0)" },
            ease: Power1.easeIn,
          },
          "-=1.3",
        )
        .fromTo(
          topLayer,
          1.5,
          { attr: { transform: "translate(0,-1000)" }, ease: Power1.easeIn },
          { attr: { transform: "translate(0,163)" }, ease: Power1.easeIn },
          "-=1.3",
        )
        .fromTo(
          boop,
          1.5,
          { attr: { transform: "translate(0,-1000)" }, ease: Power1.easeIn },
          { attr: { transform: "translate(0,0)" }, ease: Power1.easeIn },
          "-=1.5",
        )
        .fromTo(
          candle,
          1,
          { attr: { transform: "translate(236,-1000)" }, ease: Power1.easeIn },
          { attr: { transform: "translate(236,56)" }, ease: Power1.easeIn },
          "-=.5",
        )
        .to(candle, 0.05, { x: "+=2", yoyo: true, repeat: 15 }, "+=.5")
        .fromTo(
          flameL,
          0.05,
          { transform: "scale(0)", display: "none" },
          { display: "block", transform: "scale(1)" },
        );
    </script>
