            if (this[k]) for (const r of this[k]) r.dispose();
            this[k] = null;
          }
          for (const k of ["mBolt", "mBlur", "mDown", "mUp", "mMain", "mFinal"])
            if (this[k]) {
              this[k].dispose();
              this[k] = null;
            }
        }

        _programs() {
          return [this.mBlur, this.mDown, this.mUp, this.mMain, this.mFinal];
        }
        compileAll() {
          for (const m of this._programs()) {
            this.quad.material = m;
            this.renderer.compile(this.quadScene, this.quadCam);
          }
          this.renderer.compile(this.boltScene, this.quadCam);
        }
        async compileAllAsync() {
          for (const m of this._programs()) {
            this.quad.material = m;
            await this.renderer.compileAsync(this.quadScene, this.quadCam);
          }
          await this.renderer.compileAsync(this.boltScene, this.quadCam);
        }
        programErrors() {
          const gl = this.gl,
            errs = [];
          for (const p of this.renderer.info.programs || []) {
            const prog = p.program;
            if (prog && !gl.getProgramParameter(prog, gl.LINK_STATUS))
              errs.push(p.name + ": " + gl.getProgramInfoLog(prog));
          }
          return errs;
        }

        _quad(mat, rt) {
          this.quad.material = mat;
          this.renderer.setRenderTarget(rt);
          this.renderer.render(this.quadScene, this.quadCam);
        }
        clearRT(rt) {
          const r = this.renderer;
          r.setRenderTarget(rt);
          r.setClearColor(0x000000, 0);
          r.clear(true, false, false);
        }

        resize(pw, ph, scale) {
          const s = this.size;
          const changed =
            pw !== s.pw || ph !== s.ph || Math.abs(scale - s.scale) > 1e-3;
          s.pw = pw;
          s.ph = ph;
          s.scale = scale;
          this.renderer.setSize(pw, ph, false);
          if (changed) this._allocMain(false);
        }
        _allocMain(force) {
          const s = this.size;
          const mw = Math.max(16, Math.round(s.pw * s.scale)),
            mh = Math.max(16, Math.round(s.ph * s.scale));
          if (!force && this.hdr && mw === s.mw && mh === s.mh) return;
          s.mw = mw;
          s.mh = mh;
          if (this.hdr) this.hdr.setSize(mw, mh);
          else this.hdr = makeRT(mw, mh);
          if (this.down) for (const r of this.down) r.dispose();
          if (this.up) for (const r of this.up) r.dispose();
          this.down = [];
          this.up = [];
          let w = mw,
            h = mh;
          for (let i = 0; i < this.tier.bloom; i++) {
            w = Math.max(2, Math.floor(w / 2));
            h = Math.max(2, Math.floor(h / 2));
            this.down.push(makeRT(w, h));
            this.up.push(makeRT(w, h));
          }
        }

        // ---- lightning atlas: draw the segments, then blur down the halo chain
        renderBolts(list) {
          const n = Math.min(MAX_SEG, Math.floor(list.n / 6)),
            a = this.segA.array,
            b = this.segB.array,
            src = list.a;
          for (let k = 0; k < n; k++) {
            a[k * 4] = src[k * 6];
            a[k * 4 + 1] = src[k * 6 + 1];
            a[k * 4 + 2] = src[k * 6 + 2];
            a[k * 4 + 3] = src[k * 6 + 3];
            b[k * 2] = src[k * 6 + 4];
            b[k * 2 + 1] = src[k * 6 + 5];
          }
          this.segA.needsUpdate = true;
          this.segB.needsUpdate = true;
          this.boltGeo.instanceCount = n;
          this.clearRT(this.atlas);
          if (n > 0) this.renderer.render(this.boltScene, this.quadCam);
          let src2 = this.atlas;
          for (let i = 0; i < this.halo.length; i++) {
            const d = this.mDown.uniforms,
              h = this.halo[i],
              tmp = this.haloTmp[i];
            d.uSrc.value = src2.texture;
            d.uSrcTexel.value.set(1 / src2.width, 1 / src2.height);
            d.uDstTexel.value.set(1 / h.width, 1 / h.height);
            d.uPrefilter.value = 0;
            this._quad(this.mDown, tmp);
            const u = this.mBlur.uniforms;
            u.uSrc.value = tmp.texture;
            u.uDir.value.set(1 / h.width, 0);
            u.uDstTexel.value.set(1 / h.width, 1 / h.height);
            this._quad(this.mBlur, h);
            u.uSrc.value = h.texture;
            u.uDir.value.set(0, 1 / h.height);
            this._quad(this.mBlur, tmp);
            // tmp now holds the blurred level; swap so halo[i] is the result
            this.halo[i] = tmp;
            this.haloTmp[i] = h;
            src2 = tmp;
          }
          const last = this.halo[this.halo.length - 1];
          this.mainU.uHalo1.value = this.halo[0].texture;
          this.mainU.uHalo2.value = (this.halo[1] || last).texture;
          this.mainU.uHalo3.value = (this.halo[2] || last).texture;
        }

        // ---- camera: look at a point on the tubes from distance and angles, fit the row in portrait
        view(st) {
          const aspect = this.size.pw / Math.max(this.size.ph, 1);
          const c = st.cam;
          let tanY = Math.tan(CAM.fov / 2),
            dist = c.dist;
          const halfRow =
            (TUBE.n - 1) * 0.5 * TUBE.spacing +
            TUBE.capR +
            CAM.margin +
            Math.abs(c.x);
          const need = halfRow / dist;
          if (tanY * aspect < need) {
            tanY = Math.min(0.46, need / aspect); // widen a little first
            if (tanY * aspect < need) dist = halfRow / (tanY * aspect); // then step back
          }
          const cp = Math.cos(c.pitch),
            sp = Math.sin(c.pitch),
            cy = Math.cos(c.yaw),
            sy = Math.sin(c.yaw);
          // tall screens: look a little higher, so the shelf sits in the lower third rather than the middle
          const look = [c.x, c.y + 0.45 * smooth01(1.1, 0.45, aspect), 0];
          const pos = [
            look[0] + dist * sy * cp,
            look[1] - dist * sp,
            look[2] + dist * cy * cp,
          ];
          let F = [look[0] - pos[0], look[1] - pos[1], look[2] - pos[2]];
          const fl = Math.hypot(...F);
          F = F.map((v) => v / fl);
          let R = [-F[2], 0, F[0]];
          const rl = Math.hypot(...R);
          R = R.map((v) => v / rl);
          const U = [
            R[1] * F[2] - R[2] * F[1],
            R[2] * F[0] - R[0] * F[2],
            R[0] * F[1] - R[1] * F[0],
          ];
          return { pos, R, U, F, tanX: tanY * aspect, tanY, dist, aspect };
        }
        // world point to NDC (for the framing test)
        project(v, p) {
          const d = [p[0] - v.pos[0], p[1] - v.pos[1], p[2] - v.pos[2]];
          const z = d[0] * v.F[0] + d[1] * v.F[1] + d[2] * v.F[2];
          const x = d[0] * v.R[0] + d[1] * v.R[1] + d[2] * v.R[2],
            y = d[0] * v.U[0] + d[1] * v.U[1] + d[2] * v.U[2];
          return [x / (z * v.tanX), y / (z * v.tanY), z];
        }

        setScene(st, bins) {
          const M = this.mainU,
            v = this.view(st);
          M.uCamPos.value.fromArray(v.pos);
          M.uCamR.value.fromArray(v.R);
          M.uCamU.value.fromArray(v.U);
          M.uCamF.value.fromArray(v.F);
          M.uTanHalf.value.set(v.tanX, v.tanY);
          M.uTime.value = st.t;
          st.tubes.forEach((u, i) =>
            M.uTube.value[i].set(
              (i - 2) * TUBE.spacing,
              0,
              u.glow,
              u.hot ?? u.glow,
            ),
          );
          M.uBins.value.set(bins);
          // atlas texels per screen pixel across a bore: pick the mip level that matches
          const boreScreenPx = (TUBE.rIn / (v.tanX * v.dist)) * this.size.mw;
          M.uAtlasLod.value = Math.max(
            0,
            Math.log2((0.8 * this.tier.atlasW) / Math.max(boreScreenPx, 1)),
          );
          this.mFinal.uniforms.uExposure.value = st.expo;
          return v;
        }

        renderMain(band) {
          const rt = this.hdr;
          this.mainU.uRes.value.set(this.size.mw, this.size.mh);
          if (band) {
            rt.scissor.set(0, band[0], this.size.mw, band[1] - band[0]);
            rt.scissorTest = true;
          }
          this._quad(this.mMain, rt);
          rt.scissorTest = false;
        }

        post(grain) {
          const n = this.down.length;
          let src = this.hdr;
          for (let i = 0; i < n; i++) {
            const d = this.mDown.uniforms;
            d.uSrc.value = src.texture;
            d.uSrcTexel.value.set(1 / src.width, 1 / src.height);
            d.uDstTexel.value.set(
              1 / this.down[i].width,
              1 / this.down[i].height,
            );
            d.uPrefilter.value = i === 0 ? 1 : 0;
            this._quad(this.mDown, this.down[i]);
            src = this.down[i];
          }
          let low = this.down[n - 1];
          for (let i = n - 2; i >= 0; i--) {
            const u = this.mUp.uniforms;
            u.uLow.value = low.texture;
            u.uCur.value = this.down[i].texture;
            u.uLowTexel.value.set(1 / low.width, 1 / low.height);
            u.uDstTexel.value.set(1 / this.up[i].width, 1 / this.up[i].height);
            this._quad(this.mUp, this.up[i]);
            low = this.up[i];
          }
          const f = this.mFinal.uniforms;
          f.uHdr.value = this.hdr.texture;
          f.uBloom.value = low.texture;
          f.uOutRes.value.set(this.size.pw, this.size.ph);
          f.uGrain.value = grain;
          this._quad(this.mFinal, null);
          this.frame++;
        }

        // ---- test helpers: NaN or Inf anywhere in the HDR picture
        countBadPixels() {
          const { mw, mh } = this.size;
          if (RT_TYPE !== THREE.HalfFloatType) return 0;
          const buf = new Uint16Array(mw * mh * 4);
          this.renderer.readRenderTargetPixels(this.hdr, 0, 0, mw, mh, buf);
          let bad = 0;
          for (let i = 0; i < buf.length; i += 4) {
            if (
              (buf[i] & 0x7c00) === 0x7c00 ||
              (buf[i + 1] & 0x7c00) === 0x7c00 ||
              (buf[i + 2] & 0x7c00) === 0x7c00
            )
              bad++;
          }
          return bad;
        }
      }

      // ===== 45_bolts.js =====
      // ---------- lightning: the dielectric breakdown model ----------
      // Niemeyer, Pietronero and Wiesmann (1984): the discharge is a tree held at potential 0, the far
      // electrode at 1, Laplace's equation in between. Every step one free cell next to the tree joins it,
      // with probability proportional to (local potential)^eta. The field is solved on the tube's lattice
      // by successive over-relaxation and kept warm between steps. Reaching the other electrode is the
      // return stroke: the path back to the root becomes the channel, the side branches go dark.
      const BOLT = {
        eta: 1.8,
        etaTouch: 2.6,
        omega: 1.8,
        sweeps: 3,
        window: 24,
        initSweeps: 700,
        maxSteps: 5000,
        stepsPerSec: 1500, // live growth speed toward a finger
        coreW: 0.21,
        leaderW: 0.12,
        tipLen: 26, // widths in cells, how many newest nodes glow as the leader tip
      };

      class Lattice {
        constructor(W, H) {
          this.W = W;
          this.H = H;
          this.phi = new Float32Array(W * H);
          this.fixed = new Uint8Array(W * H); // 0 free, 1 tree (0 V), 2 electrode (1 V)
          this.nodes = []; // {x, y, p: parent index, k: hops off the main channel}
          this.cand = []; // candidate cells, as indices
          this.inCand = new Uint8Array(W * H);
          this.map = new Int32Array(W * H); // cell -> node index
          this.wts = new Float32Array(W * H);
        }
        reset(seed, target) {
          const { W, H } = this;
          this.rng = mulberry32(seed);
          this.phi.fill(0.5);
          this.fixed.fill(0);
          this.inCand.fill(0);
          this.map.fill(-1);
          this.nodes.length = 0;
          this.cand.length = 0;
          this.done = false;
          this.connect = -1;
          this.steps = 0;
          this.target = target; // {x, y, r}: cells within r of it count as the far electrode
          const cx = (W - 1) / 2;
          for (let x = 0; x < W; x++)
            for (let y = 0; y < H; y++) {
              const dx = x - target.x,
                dy = y - target.y;
              if (dx * dx + dy * dy <= target.r * target.r) {
                this.fixed[y * W + x] = 2;
                this.phi[y * W + x] = 1;
              }
            }
          // root: the cathode pin tip
          this._add(Math.round(cx), 0, -1);
          this.relax(BOLT.initSweeps);
        }
        _add(x, y, p) {
          const { W } = this,
            i = y * W + x;
          this.fixed[i] = 1;
          this.phi[i] = 0;
          this.map[i] = this.nodes.length;
          this.nodes.push({ x, y, p, k: 0 });
          if (this.inCand[i]) {
            this.inCand[i] = 0;
            const j = this.cand.indexOf(i);
            if (j >= 0) {
              this.cand[j] = this.cand[this.cand.length - 1];
              this.cand.pop();
            }
          }
          for (let dy = -1; dy <= 1; dy++)
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx,
                ny = y + dy;
              if (nx < 0 || nx >= W || ny < 0 || ny >= this.H) continue;
              const n = ny * W + nx;
              if (this.fixed[n] === 0 && !this.inCand[n]) {
                this.inCand[n] = 1;
                this.cand.push(n);
              }
            }
        }
        // red-black SOR, Neumann at the glass and the open ends, Dirichlet on the tree and the electrode.
        // Rows [ya, yb) only: after one new cell the field only moves nearby.
        relax(sweeps, ya = 0, yb = this.H) {
          const { W, H, phi, fixed } = this,
            w = BOLT.omega;
          for (let s = 0; s < sweeps; s++) {
            for (let parity = 0; parity < 2; parity++) {
              for (let y = ya; y < yb; y++) {
                const yd = y > 0 ? y - 1 : y + 1,
                  yu = y < H - 1 ? y + 1 : y - 1;
                for (let x = (y + parity) & 1; x < W; x += 2) {
                  const i = y * W + x;
                  if (fixed[i]) continue;
                  const xl = x > 0 ? x - 1 : x + 1,
                    xr = x < W - 1 ? x + 1 : x - 1;
                  const avg =
                    0.25 *
                    (phi[y * W + xl] +
                      phi[y * W + xr] +
                      phi[yd * W + x] +
                      phi[yu * W + x]);
                  phi[i] += w * (avg - phi[i]);
                }
              }
            }
          }
        }
        // one growth step; true when the tree has just reached the far electrode
        step(eta) {
          if (this.done || this.cand.length === 0) {
            this.done = true;
            return false;
          }
          const { W, phi, cand } = this;
          let sum = 0;
          const wts = this.wts;
          for (let j = 0; j < cand.length; j++) {
            const v = Math.max(phi[cand[j]], 0);
            const p = Math.pow(v, eta);
            wts[j] = p;
            sum += p;
          }
          let r = this.rng() * sum,
            j = 0;
          if (sum <= 0) j = Math.floor(this.rng() * cand.length);
          else {
            for (; j < cand.length - 1; j++) {
              r -= wts[j];
              if (r <= 0) break;
            }
          }
          const i = cand[j],
            x = i % W,
            y = (i - x) / W;
          // parent: the tree neighbor with the lowest index (the oldest), a straight-ish channel
          let p = -1,
            best = 1e9;
          for (let dy = -1; dy <= 1; dy++)
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx,
                ny = y + dy;
              if (
                nx < 0 ||
                nx >= W ||
                ny < 0 ||
                ny >= this.H ||
                this.fixed[ny * W + nx] !== 1
              )
                continue;
              const idx = this.map[ny * W + nx];
              if (idx >= 0 && idx < best) {
                best = idx;
                p = idx;
              }
            }
          this._add(x, y, p);
          this.steps++;
          // touching the far electrode?
          const n = this.nodes.length - 1;
          for (let dy = -1; dy <= 1 && !this.done; dy++)
            for (let dx = -1; dx <= 1; dx++) {
              const nx = x + dx,
                ny = y + dy;
              if (nx < 0 || nx >= W || ny < 0 || ny >= this.H) continue;
              if (this.fixed[ny * W + nx] === 2) {
                this.done = true;
                this.connect = n;
                break;
              }
            }
          if (!this.done && this.steps >= BOLT.maxSteps) {
            this.done = true;
            this.connect = this._highest();
          }
          if (this.done) this._markMain();
          else
            this.relax(
              BOLT.sweeps,
              Math.max(0, y - BOLT.window),
              Math.min(this.H, y + BOLT.window),
            );
          return this.done;
        }
        _highest() {
          let b = 0;
          for (let k = 1; k < this.nodes.length; k++)
            if (this.nodes[k].y > this.nodes[b].y) b = k;
          return b;
        }
        // hops from the main channel for every node (0 on the channel)
        _markMain() {
          const N = this.nodes;
          for (const n of N) n.k = 1e9;
          for (let k = this.connect; k >= 0; k = N[k].p) N[k].k = 0;
          for (let k = 1; k < N.length; k++)
            if (N[k].k > 0) N[k].k = N[N[k].p].k + 1;
        }
      }
      // One tube: the scheduled bolts (grown whole, then revealed in time) and the live bolt to a finger.
      class Tube {
        constructor(i, score) {
          this.i = i;
          this.score = score;
          this.lat = new Lattice(TUBE.gridW, TUBE.gridH); // scheduled bolts
          this.liveLat = new Lattice(TUBE.gridW, TUBE.gridH); // the bolt toward the pointer
          this.trees = new Map(); // cycle seed -> snapshot
          this.job = null; // a scheduled tree being grown a few steps per frame
          this.live = null;
          this.bins = new Float32Array(6);
          this.topTarget = {
            x: (TUBE.gridW - 1) / 2,
            y: TUBE.gridH - 1,
            r: 1.2,
          };
        }
        _store(seed, snap) {
          if (this.trees.size > 6)
            this.trees.delete(this.trees.keys().next().value);
          this.trees.set(seed, snap);
          return snap;
        }
        // the whole tree of a scheduled cycle (cached); grown here and now if it is not ready
        tree(c) {
          const t = this.trees.get(c.seed);
          if (t) return t;
          const lat = this.lat;
          if (!this.job || this.job.seed !== c.seed) {
            lat.reset(c.seed, this.topTarget);
            this.job = { seed: c.seed };
          }
          while (!lat.step(BOLT.eta)) {
            /* grow until the return stroke */
          }
          this.job = null;
          return this._store(c.seed, this._snapshot(lat, c.seed));
        }
        // The next scheduled bolt that still needs growing (soonest first), looking a few seconds ahead.
        pending(t) {
          const cs = this.score.cycles[this.i];
          let best = null;
          for (const c of cs) {
            for (const off of [0, LOOP_SEC]) {
              const tg = c.tg + off;
              if (
                tg > t - 0.5 &&
                tg < t + 6.0 &&
                !this.trees.has(c.seed) &&
                (!best || tg < best.tg)
              )
                best = { c, tg };
            }
          }
          return best ? best.c : null;
        }
        // Grow a scheduled bolt in the background, a little per frame, so no frame stalls.
        grow(c, budgetMs) {
          const until = performance.now() + budgetMs,
            lat = this.lat;
          if (!this.job || this.job.seed !== c.seed) {
            lat.reset(c.seed, this.topTarget);
            this.job = { seed: c.seed };
          }
          while (performance.now() < until) {
            if (lat.step(BOLT.eta)) {
              this._store(c.seed, this._snapshot(lat, c.seed));
              this.job = null;
              return true;
            }
          }
          return false;
        }
        _snapshot(lat, seed) {
          const n = lat.nodes.length,
            nodes = new Float32Array(n * 2),
            parent = new Int32Array(n),
            off = new Int32Array(n),
            jit = new Float32Array(n * 2);
          lat.nodes.forEach((o, k) => {
            nodes[2 * k] = o.x;
            nodes[2 * k + 1] = o.y;
            parent[k] = o.p;
            off[k] = Math.min(o.k, 1000);
            jit[2 * k] = (hashUnit(seed * 7919 + k * 2) - 0.5) * 0.7;
            jit[2 * k + 1] = (hashUnit(seed * 7919 + k * 2 + 1) - 0.5) * 0.7;
          });
          // the main channel, root to far electrode, as a smoothed polyline (a filament, not a staircase)
          const path = [];
          for (let k = lat.connect; k >= 0; k = lat.nodes[k].p) path.push(k);
          path.reverse();
          const m = path.length,
            sm = new Float32Array(m * 2);
          for (let q = 0; q < m; q++) {
            let sx = 0,
              sy = 0,
              sw = 0;
            for (let d = -3; d <= 3; d++) {
              const j = q + d;
              if (j < 0 || j >= m) continue;
              const w = 4 - Math.abs(d),
                k = path[j];
              sx += w * (nodes[2 * k] + jit[2 * k]);
              sy += w * (nodes[2 * k + 1] + jit[2 * k + 1]);
              sw += w;
            }
            sm[2 * q] = sx / sw;
            sm[2 * q + 1] = sy / sw;
          }
          return { n, nodes, parent, off, jit, connect: lat.connect, path, sm };
        }

        // ---- live bolt toward the pointer (cell coordinates inside the bore)
        touch(cx, cy, now) {
          const L = this.live;
          const tgt = {
            x: clamp(Math.round(cx), 0, TUBE.gridW - 1),
            y: clamp(Math.round(cy), 2, TUBE.gridH - 1),
            r: 1.3,
          };
          const moved =
            L &&
            Math.abs(tgt.x - L.target.x) + Math.abs(tgt.y - L.target.y) > 5;
          if (!L || (L.done && (now - L.doneAt > 0.6 || moved))) {
            // a new strike to the finger
            const seed = 1e6 + Math.floor(now * 1000) + this.i;
            this.liveLat.reset(seed, tgt);
            this.live = {
              target: tgt,
              done: false,
              doneAt: 0,
              start: now,
              snap: null,
              last: now,
              seed,
              strikes: L ? L.strikes + 1 : 0,
              struck: false,
            };
          }
          this.live.until = now + 0.25; // the finger is here; the bolt stays while it keeps being touched
        }
        _stepLive(now) {
          const L = this.live,
            lat = this.liveLat;
          if (!L) return;
          if (!L.done) {
            const n = Math.min(
              80,
              Math.floor((now - L.last) * BOLT.stepsPerSec),
            );
            for (let k = 0; k < n && !L.done; k++)
              if (lat.step(BOLT.etaTouch)) {
                L.done = true;
                L.doneAt = now;
              }
            if (n > 0) L.last = now;
            L.snap = this._snapshot(lat, L.seed);
          }
          if (now > L.until + 0.5) this.live = null; // the finger left: let it fade
        }

        // ---- segments for the atlas at loop time t
        // out: Float32Array builder (ax, ay, bx, by, width, intensity), in atlas uv. Returns the glow 0..1.
        emit(t, now, out, pointer) {
          const i = this.i,
            st = this.score,
            c = st.cycleAt(i, t);
          this.bins.fill(0);
          let glow = st.glow(c, t);
          if (pointer) this.touch(pointer.cx, pointer.cy, now);
          this._stepLive(now);
          const L = this.live;
          if (L && L.snap) {
            // the live bolt replaces the scheduled one while it lasts
            const since = L.done ? now - L.doneAt : -1,
              fade = now > L.until ? Math.exp(-(now - L.until) / 0.18) : 1;
            this._emitTree(L.snap, L.snap.n, since, t, out, fade, true);
            glow = Math.max(
              glow,
              (L.done ? 0.55 + 0.5 * Math.exp(-since / 0.1) : 0.08) * fade,
            );
            return glow;
          }
          if (!c || t >= c.tx + 0.3) return glow;
          const T = this.tree(c);
          if (t < c.tc) {
            const p = clamp((t - c.tg) / (c.tc - c.tg), 0, 1);
            const nRev = Math.max(2, Math.round(T.n * Math.pow(p, 1.6)));
            this._emitTree(T, nRev, -1, t, out, 1, false);
          } else {
            this._emitTree(
              T,
              T.n,
              t - c.tc,
              t,
              out,
              t < c.tx ? 1 : Math.exp(-(t - c.tx) / 0.09),
              false,
            );
          }
          return glow;
        }
        // since < 0: still growing (leader); else seconds since the return stroke
        _emitTree(T, nRev, since, t, out, fade, live) {
          const W = TUBE.gridW,
            H = TUBE.gridH,
            i = this.i;
          const u0 = (i + 0.1) / TUBE.n,
            du = 0.8 / TUBE.n / W,
            v0 = TUBE.pinLen,
            dv = (1 - 2 * TUBE.pinLen) / H;
          const flash = since >= 0 ? Math.exp(-since / 0.09) : 0;
          const wob = since >= 0 ? Math.min(1, since / 0.6) : 0;
          const flick =
            since >= 0 ? 0.8 + 0.4 * hashUnit(Math.floor(t * 47) + i * 131) : 1;
          const ph = t * 7.0 + i;
          const wobAt = (y) =>
            wob *
            0.45 *
            Math.sin(ph + y * 0.21) *
            (0.3 + 0.7 * Math.sin(y * 0.05 + ph * 0.3) ** 2);
          if (since >= 0) {
            // the channel: smoothed path, writhing a little as it heats
            const I = (0.9 + 1.7 * flash) * flick * fade,
              w = BOLT.coreW * (1 + 0.6 * flash),
              sm = T.sm,
              m = T.path.length;
            for (let q = 1; q < m; q++) {
              const ay = sm[2 * q - 1] + 0.5,
                by = sm[2 * q + 1] + 0.5;
              const ax = sm[2 * q - 2] + 0.5 + wobAt(ay),
                bx = sm[2 * q] + 0.5 + wobAt(by);
              out.push(
                u0 + ax * du,
                v0 + ay * dv,
                u0 + bx * du,
                v0 + by * dv,
                w * du,
                I,
              );
              this.bins[Math.min(5, Math.floor(((by - 0.5) / H) * 6))] += I;
            }
          }
          for (let k = 1; k < nRev; k++) {
            const p = T.parent[k];
            if (p < 0) continue;
            let I, w;
            if (since < 0) {
              const age = nRev - k;
              I =
                age < BOLT.tipLen
                  ? 0.35 + 1.1 * (1 - age / BOLT.tipLen)
                  : 0.3 - 0.12 * Math.min(1, age / 300);
              w = BOLT.leaderW;
            } else {
              if (T.off[k] === 0) continue; // drawn above
              I = 0.9 * flash * Math.exp(-T.off[k] / 10);
              if (I < 0.01) continue;
              w = BOLT.leaderW;
            }
            I *= fade;
            const yk = T.nodes[2 * k + 1],
              yp = T.nodes[2 * p + 1];
            const wx = wobAt(yk);
            const ax = T.nodes[2 * p] + 0.5 + T.jit[2 * p] + wx,
              ay = yp + 0.5 + T.jit[2 * p + 1];
            const bx = T.nodes[2 * k] + 0.5 + T.jit[2 * k] + wx,
              by = yk + 0.5 + T.jit[2 * k + 1];
            out.push(
              u0 + ax * du,
              v0 + ay * dv,
              u0 + bx * du,
              v0 + by * dv,
              w * du,
              I,
            );
            this.bins[Math.min(5, Math.floor((yk / H) * 6))] += I;
          }
          // hot spots on the electrodes while a channel carries current
          if (since >= 0) {
            const I = (0.8 + 1.2 * flash) * flick * fade,
              cx = (W / 2) * du + u0;
            out.push(cx, v0 - 0.004, cx, v0 + 0.004, 0.9 * du, I);
            if (!live)
              out.push(
                cx,
                1 - v0 - 0.004,
                cx,
                1 - v0 + 0.004,
                0.7 * du,
                I * 0.6,
              );
          }
        }
      }

      // a growable float list for the instance buffer
      class FloatList {
        constructor(n) {
          this.a = new Float32Array(n);
          this.n = 0;
        }
        push(ax, ay, bx, by, w, I) {
          if (this.n + 6 > this.a.length) {
            const b = new Float32Array(this.a.length * 2);
            b.set(this.a);
            this.a = b;
          }
          const a = this.a,
            n = this.n;
          a[n] = ax;
          a[n + 1] = ay;
          a[n + 2] = bx;
          a[n + 3] = by;
          a[n + 4] = w;
          a[n + 5] = I;
          this.n = n + 6;
        }
        clear() {
          this.n = 0;
        }
      }

      // ===== 50_audio.js =====
      // ---------- sound: the choir of spectral lines ----------
      // Every voice is a gas. Each of its strongest emission lines becomes one singer: an oscillator at
      // the line's frequency divided by 2^40 (forty octaves below the light), with the overtones of a
      // sung vowel, through a formant filter bank so the chord reads as a choir. A tube sings while
      // it carries current; the return stroke adds a crackle. Beds and events are scheduled from the
      // score, and the same code renders the offline test.
      function softClipCurve() {
        const n = 4096,
          c = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1,
            a = Math.abs(x);
          c[i] =
            a < 0.85
              ? x
              : Math.sign(x) * (0.85 + 0.13 * Math.tanh((a - 0.85) / 0.13));
        }
        return c;
      }
      // vowel formants (Hz): oo -> ah, three formants each
      const VOWEL_OO = [330, 700, 2530],
        VOWEL_AH = [700, 1220, 2600];
      const FORMANT_GAIN = [1.0, 0.55, 0.22];

      class SoundEngine {
        constructor(score) {
          this.score = score;
          this.ctx = null;
          this.on = false;
          this.timer = 0;
          this.origin = 0;
          this.cursor = 0;
        }

        _noise(ctx, seconds, seed) {
          const n = Math.floor(ctx.sampleRate * seconds);
          const buf = ctx.createBuffer(2, n, ctx.sampleRate);
          const rng = mulberry32(seed);
          for (let ch = 0; ch < 2; ch++) {
            const d = buf.getChannelData(ch);
            for (let i = 0; i < n; i++) d[i] = rng() * 2 - 1;
            const fade = Math.floor(ctx.sampleRate * 0.05);
            for (let i = 0; i < fade; i++) {
              const k = i / fade;
              d[i] = d[i] * k + d[n - fade + i] * (1 - k);
            }
          }
          return buf;
        }
        // a stone room: decaying stereo noise with a little early density
        _impulse(ctx, seconds) {
          const n = Math.floor(ctx.sampleRate * seconds);
          const buf = ctx.createBuffer(2, n, ctx.sampleRate);
          const rng = mulberry32(77);
          for (let ch = 0; ch < 2; ch++) {
            const d = buf.getChannelData(ch);
            for (let i = 0; i < n; i++) {
              const t = i / ctx.sampleRate;
              d[i] =
                (rng() * 2 - 1) *
                Math.exp(-t / (seconds * 0.27)) *
                (1 - Math.exp(-t / 0.012)) *
                (0.7 + 0.3 * Math.exp(-t / 0.08));
            }
          }
          return buf;
        }

        build(ctx, dest, offline, only = null) {
          this.ctx = ctx;
          this.only = only; // test: index of a single gas to render alone
          this.white = this._noise(ctx, 4.0, 11);
          const N = (this.N = {});
          N.bus = ctx.createGain();
          N.comp = ctx.createDynamicsCompressor();
          N.comp.threshold.value = -18;
          N.comp.knee.value = 12;
          N.comp.ratio.value = 3;
          N.comp.attack.value = 0.01;
          N.comp.release.value = 0.4;
          N.master = ctx.createGain();
          N.master.gain.value = offline ? 0.9 : 0.0;
          N.safety = ctx.createWaveShaper();
          N.safety.curve = softClipCurve();
          N.bus
            .connect(N.comp)
            .connect(N.master)
            .connect(N.safety)
            .connect(dest);
          N.verbIn = ctx.createGain();
          N.verbIn.gain.value = 0.34;
          N.verb = ctx.createConvolver();
          N.verb.buffer = this._impulse(ctx, 4.5);
          N.verbIn.connect(N.verb).connect(N.bus);
          N.lp = ctx.createBiquadFilter();
          N.lp.type = "lowpass";
          N.lp.frequency.value = 5200;
          N.lp.Q.value = 0.5;
          N.lp.connect(N.bus);
          N.lp.connect(N.verbIn);
          // one singer's overtones: a sung tone, bright but not buzzy
          const H = [
            0, 1, 0.62, 0.42, 0.3, 0.22, 0.16, 0.11, 0.08, 0.055, 0.04, 0.03,
          ];
          N.wave = ctx.createPeriodicWave(
            new Float32Array(H.length),
            new Float32Array(H),
            { disableNormalization: false },
          );
          N.voices = GASES.map((g, i) =>
            only === null || only === i ? this._voice(ctx, i) : null,
          );
        }
        _voice(ctx, i) {
          const N = this.N,
            chord = GAS_CHORD[i];
          const v = {
            osc: [],
            gain: ctx.createGain(),
            touch: ctx.createGain(),
            mix: ctx.createGain(),
            form: [],
            pan: ctx.createStereoPanner(),
          };
          v.gain.gain.value = 0; // what the score says
          v.touch.gain.value = 0; // what the finger adds
          v.pan.pan.value = GASES[i].pan;
          const sum = ctx.createGain();
          sum.gain.value = 0.9;
          // two slow movements shared by the gas's singers: a drift and a vibrato
          const lfo1 = ctx.createOscillator();
          lfo1.frequency.value = 0.11 + 0.02 * i;
          const d1 = ctx.createGain();
          d1.gain.value = 7;
          lfo1.connect(d1);
          lfo1.start();
          const lfo2 = ctx.createOscillator();
          lfo2.frequency.value = 4.4 + 0.37 * i;
          const d2 = ctx.createGain();
          d2.gain.value = 2.5;
          lfo2.connect(d2);
          lfo2.start();
          v.lfoDepth = [d1, d2];
          chord.forEach((p, k) => {
            const o = ctx.createOscillator();
            o.setPeriodicWave(N.wave);
            o.frequency.value = p.hz;
            o.detune.value = (hashUnit(i * 97 + k) - 0.5) * 4; // each singer a hair off, like people
            d1.connect(o.detune);
            d2.connect(o.detune);
            const g = ctx.createGain();
            g.gain.value = p.amp;
            o.connect(g).connect(sum);
            o.start();
            v.osc.push(o);
          });
          // formants: three band passes in parallel plus a little of the raw tone
          for (let k = 0; k < 3; k++) {
            const f = ctx.createBiquadFilter();
            f.type = "bandpass";
            f.Q.value = 6.5;
            f.frequency.value = VOWEL_OO[k];
            const fg = ctx.createGain();
            fg.gain.value = FORMANT_GAIN[k] * 1.4;
            sum.connect(f).connect(fg).connect(v.mix);
            v.form.push(f);
          }
          const dry = ctx.createGain();
          dry.gain.value = 0.3;
          sum.connect(dry).connect(v.mix);
          v.mix.connect(v.gain).connect(v.pan);
          v.mix.connect(v.touch).connect(v.pan);
          v.pan.connect(N.lp);
          return v;
        }

        // what the voices do at loop time t
        curves(t) {
          const S = this.score,
            bed = S.value("bed", t),
            vowel = S.value("vowel", t);
          return {
            gain: GASES.map(
              (g, i) => 0.11 * Math.min(1.2, S.voice(i, t) + 0.28 * bed),
            ),
            formants: [0, 1, 2].map((k) =>
              lerp(VOWEL_OO[k], VOWEL_AH[k], vowel),
            ),
          };
        }

        // Schedule loop window [a, b) at audio time base + t.
        scheduleWindow(a, b, base) {
          const N = this.N,
            step = 0.05;
          for (let k = Math.ceil(a / step); k * step < b; k++) {
            const tt = k * step,
              c = this.curves(tt),
              at = base + tt;
            N.voices.forEach((v, i) => {
              if (!v) return;
              v.gain.gain.linearRampToValueAtTime(c.gain[i], at);
              v.form.forEach((f, j) =>
                f.frequency.linearRampToValueAtTime(c.formants[j], at),
              );
            });
          }
          this.score.sounds.forEach((e, k) => {
            if (e.t < a || e.t >= b) return;
            if (this.only !== null && e.tube !== this.only) return;
            const at = base + e.t;
            if (this.sent) {
              if (Math.abs(at - (this.sent.get(k) ?? -1e9)) < 2) return;
              this.sent.set(k, at);
            }
            this._strike(e.tube, at, e.cycle.kind === "tutti" ? 1.3 : 1.0);
          });
        }

        _out(node, pan, verb) {
          let n = node;
          if (pan) {
            const p = this.ctx.createStereoPanner();
            p.pan.value = pan;
            n.connect(p);
            n = p;
          }
          n.connect(this.N.bus);
          if (verb) {
            const g = this.ctx.createGain();
            g.gain.value = verb;
            n.connect(g).connect(this.N.verbIn);
          }
        }
        _env(g, at, peak, attack, tau) {
          g.gain.setValueAtTime(0, at);
          g.gain.linearRampToValueAtTime(peak, at + attack);
          g.gain.setTargetAtTime(0, at + attack, tau);
        }
        _noiseShot(at, dur, filters, peak, attack, tau, pan = 0, verb = 0) {
          const ctx = this.ctx;
          const s = ctx.createBufferSource();
          s.buffer = this.white;
          let node = s;
          for (const [type, f, q] of filters) {
            const b = ctx.createBiquadFilter();
            b.type = type;
            b.frequency.value = f;
            b.Q.value = q || 0.707;
            node.connect(b);
            node = b;
          }
          const g = ctx.createGain();
          node.connect(g);
          this._out(g, pan, verb);
          this._env(g, at, peak, attack, tau);
          s.start(at, (at * 7.31) % (this.white.duration - dur - 0.1), dur);
          return { s, g, filt: node };
        }
        // the return stroke: a crack with a little body, then the channel's hiss settling
        _strike(i, at, k = 1) {
          const pan = GASES[i].pan * 0.9;
          this._noiseShot(
            at,
            0.06,
            [["highpass", 3200, 0.7]],
            0.1 * k,
            0.001,
            0.012,
            pan,
            0.5,
          );
          this._noiseShot(
            at,
            0.25,
            [["bandpass", 1400, 1.2]],
            0.055 * k,
            0.003,
            0.05,
            pan,
            0.6,
          );
          this._noiseShot(
            at + 0.01,
            0.9,
            [["bandpass", 5200, 2.0]],
            0.012 * k,
            0.05,
            0.3,
            pan,
            0.4,
          );
        }

        // ---- realtime
        // The picture keeps its own clock and the sound follows it, so a slow or stalled audio device can
        // never freeze the animation. Every 200 ms pump() checks that what is heard matches what is seen
        // and re-anchors the schedule if the audio clock stalled or drifted.
        enable(clock) {
          this.clock = clock;
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return false;
            let ctx;
            try {
              ctx = new AC();
            } catch (err) {
              return false;
            }
            this.build(ctx, ctx.destination, false);
            this.sent = new Map();
            this.syncs = 0;
            ctx.addEventListener("statechange", () => {
              if (this.on && ctx.state === "running") {
                this._sync(true);
                this.pump();
              }
            });
          }
          const ctx = this.ctx,
            N = this.N;
          this.on = true;
          this.origin = null;
          const now = ctx.currentTime;
          N.master.gain.cancelScheduledValues(now);
          N.master.gain.setValueAtTime(N.master.gain.value, now);
          N.master.gain.linearRampToValueAtTime(0.9, now + 0.4);
          this.wake();
          clearInterval(this.timer);
          this.timer = setInterval(() => this.pump(), 200);
          this.pump();
          return true;
        }
        // (re)start the audio device; browsers only allow this from a click, tap or key press
        wake() {
          if (this.on && this.ctx && this.ctx.state !== "running")
            this.ctx.resume().catch(() => {});
        }
        disable() {
          if (!this.ctx) return;
          const ctx = this.ctx,
            now = ctx.currentTime;
          this.on = false;
          clearInterval(this.timer);
          this.N.master.gain.cancelScheduledValues(now);
          this.N.master.gain.setValueAtTime(this.N.master.gain.value, now);
          this.N.master.gain.linearRampToValueAtTime(0, now + 0.25);
          setTimeout(() => {
            if (!this.on) ctx.suspend();
          }, 400);
        }
        // Line the schedule up with the picture: audio time = origin + loop time (+ output latency).
        _sync(force) {
          const ctx = this.ctx;
          if (!ctx || ctx.state !== "running") return;
          const V = this.clock();
          this.latency = ctx.outputLatency || ctx.baseLatency || 0.02;
          if (!force && this.origin !== null) {
            let d = ctx.currentTime - this.latency - this.origin - V;
            d -= LOOP_SEC * Math.round(d / LOOP_SEC);
            if (Math.abs(d) < 0.15) return;
          }
          const now = ctx.currentTime,
            N = this.N;
          const params = [];
          N.voices.forEach((v) => {
            if (v) {
              params.push(v.gain.gain);
              v.form.forEach((f) => params.push(f.frequency));
            }
          });
          for (const p of params) {
            const val = p.value;
            p.cancelScheduledValues(now);
            p.setValueAtTime(val, now);
          }
          this.origin = now - this.latency - V;
          this.cursor = V + this.latency + 0.08;
          this.syncs++;
        }
        pump() {
          if (!this.on || !this.ctx || this.ctx.state !== "running") return;
          this._sync(false);
          const until = this.ctx.currentTime - this.origin + 1.2;
          let guard = 0;
          while (this.cursor < until && guard++ < 8) {
            const loop = Math.floor(this.cursor / LOOP_SEC);
            const a = this.cursor - loop * LOOP_SEC;
            const b = Math.min(LOOP_SEC, a + (until - this.cursor));
            if (b - a < 1e-4) {
              this.cursor = (loop + 1) * LOOP_SEC;
              continue;
            }
            this.scheduleWindow(a, b, this.origin + loop * LOOP_SEC);
            this.cursor += b - a;
          }
        }
        // loop time of what is being heard right now (for tests and the drift check)
        loopTime() {
          const t = this.ctx.currentTime - this.latency - this.origin;
          return ((t % LOOP_SEC) + LOOP_SEC) % LOOP_SEC;
        }
        // a bolt to the finger: the crack now, and that tube's voice held up while it is touched
        zap(i, k = 1) {
          if (!this.ctx || !this.on || this.ctx.state !== "running") return;
          const at = this.ctx.currentTime + 0.01;
          this._strike(i, at, 0.8 * k);
        }
        // the touched tube sings on top of the score for as long as the finger stays
        hold(i, level) {
          if (!this.ctx || !this.on || this.ctx.state !== "running") return;
          const v = this.N.voices[i];
          if (!v) return;
          const now = this.ctx.currentTime,
            g = v.touch.gain;
          g.cancelScheduledValues(now);
          g.setValueAtTime(g.value, now);
          g.linearRampToValueAtTime(0.11 * level, now + 0.1);
          g.setTargetAtTime(0, now + 0.4, 0.5);
        }
      }

      // ===== 60_app.js =====
      // ---------- app: clock, input, adaptive quality, still mode ----------
      class App {
        constructor() {
          this.canvas = document.getElementById("c");
          this.btn = document.getElementById("snd");
          this.score = new Score();
          this.gpu = new ChoirGPU(this.canvas);
          this.sound = new SoundEngine(this.score);
          this.tubes = GASES.map((g, i) => new Tube(i, this.score));
          this.segs = new FloatList(6 * 4096);
          this.bins = new Float32Array(30);
          this.still =
            !TEST_MODE &&
            !FORCE_ANIMATE &&
            (this.gpu.software || !this.gpu.floatRT);
          const asked = TIERS[QUERY.get("tier")] ? QUERY.get("tier") : null;
          this.tierName = asked || (this.still ? "mobile" : this._pickTier());
          this.gpu.setTier(TIERS[this.tierName]);
          this.clock = { base: performance.now(), offset: START_AT };
          this.ptr = {
            on: false,
            tube: -1,
            cx: 0,
            cy: 0,
            lastHold: 0,
            x: 0,
            y: 0,
            down: false,
          };
          this.gov = {
            scale: TIERS[this.tierName].scaleMax,
            ema: 16.7,
            slow: 0,
            fast: 0,
            hold: 0,
          };
          this.frameCount = 0;
          this.lastNow = 0;
          this.viewNow = null;
          this._frame = (now) => this.frame(now);
          this._bindInput();
          this.applySize();
        }

        _pickTier() {
          const ua = navigator.userAgent || "";
          const coarse =
            window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          if (
            /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
            (coarse && Math.min(screen.width, screen.height) < 900)
          )
            return "mobile";
          if (
            /Intel|Iris|UHD|HD Graphics|Mali|Adreno|PowerVR|Radeon\(TM\) Graphics|Vega \d/i.test(
              this.gpu.rendererName,
            )
          )
            return "laptop";
          return "desktop";
        }

        applySize() {
          const t = TIERS[this.tierName];
          const dpr = TEST_MODE
            ? 1
            : Math.min(window.devicePixelRatio || 1, t.dprMax);
          let pw = Math.max(2, Math.round(this.canvas.clientWidth * dpr));
          let ph = Math.max(2, Math.round(this.canvas.clientHeight * dpr));
          const cap = 3840 * 2160;
          if (pw * ph > cap) {
            const k = Math.sqrt(cap / (pw * ph));
            pw = Math.round(pw * k);
            ph = Math.round(ph * k);
          }
          let scale = TEST_MODE
            ? this.gov.scale
            : Math.min(this.gov.scale, Math.sqrt(t.budget / (pw * ph)));
          if (this.still) scale = Math.min(1, Math.sqrt(900000 / (pw * ph)));
          this.gpu.resize(pw, ph, scale);
        }

        // The animation always runs on its own clock; the sound follows it (never the other way round).
        loopTime(now) {
          const t = (now - this.clock.base) / 1000 + this.clock.offset;
          return ((t % LOOP_SEC) + LOOP_SEC) % LOOP_SEC;
        }
        _reanchor(t) {
          this.clock.base = performance.now();
          this.clock.offset = t;
        }

        // screen point (CSS pixels) to a spot inside a tube: which tube, lattice cell (cx, cy)
        toTube(px, py) {
          const v = this.viewNow;
          if (!v) return null;
          const sx = (px / Math.max(window.innerWidth, 1)) * 2 - 1,
            sy = 1 - (py / Math.max(window.innerHeight, 1)) * 2;
          const d = [0, 1, 2].map(
            (k) => v.F[k] + v.R[k] * sx * v.tanX + v.U[k] * sy * v.tanY,
          );
          const dl = Math.hypot(...d);
          const rd = d.map((x) => x / dl),
            ro = v.pos;
          let best = null;
          for (let i = 0; i < TUBE.n; i++) {
            const cx = (i - 2) * TUBE.spacing,
              cz = 0,
              r = TUBE.rOut * 1.5;
            const ox = ro[0] - cx,
              oz = ro[2] - cz,
              a = rd[0] * rd[0] + rd[2] * rd[2];
            if (a < 1e-9) continue;
            const b = ox * rd[0] + oz * rd[2],
              c = ox * ox + oz * oz - r * r,
              disc = b * b - a * c;
            if (disc < 0) continue;
            const t0 = (-b - Math.sqrt(disc)) / a;
            if (t0 <= 0 || (best && t0 > best.t)) continue;
            // the spot on the plane through the axis that faces the camera
            const npx = ro[0] - cx,
              npz = ro[2] - cz,
              nl = Math.hypot(npx, npz),
              nx = npx / nl,
              nz = npz / nl;
            const denom = rd[0] * nx + rd[2] * nz;
            if (Math.abs(denom) < 1e-6) continue;
            const tp = ((cx - ro[0]) * nx + (cz - ro[2]) * nz) / denom;
            const qx = ro[0] + rd[0] * tp,
              qy = ro[1] + rd[1] * tp,
              qz = ro[2] + rd[2] * tp;
            const u = ((qx - cx) * -nz + (qz - cz) * nx) / TUBE.rIn; // along the tangent, -1..1 across the bore
            const yv =
              (qy - TUBE.glassY0 - TUBE.pinLen) / (1 - 2 * TUBE.pinLen);
            if (yv < -0.08 || yv > 1.08 || Math.abs(u) > 1.4) continue;
            best = {
              t: t0,
              tube: i,
              cx: clamp(u * 0.5 + 0.5, 0, 1) * (TUBE.gridW - 1),
              cy: clamp(yv, 0.02, 0.98) * (TUBE.gridH - 1),
            };
          }
          return best;
        }

        _bindInput() {
          const c = this.canvas,
            P = this.ptr;
          const at = (e) => {
            const hit = this.toTube(e.clientX, e.clientY);
            if (hit) {
              P.on = true;
              P.tube = hit.tube;
              P.cx = hit.cx;
              P.cy = hit.cy;
            } else P.on = false;
            P.x = e.clientX;
            P.y = e.clientY;
          };
          c.addEventListener("pointerdown", (e) => {
            this.sound.wake();
            if (e.pointerType === "mouse" && e.button !== 0) return;
            P.down = true;
            at(e);
            try {
              c.setPointerCapture(e.pointerId);
            } catch (err) {
              /* capture is optional */
            }
          });
          c.addEventListener("pointermove", (e) => {
            if (e.pointerType === "mouse" || P.down) at(e);
          });
          const off = () => {
            P.down = false;
            P.on = false;
          };
          c.addEventListener("pointerup", (e) => {
            P.down = false;
            if (e.pointerType !== "mouse") P.on = false;
          });
          c.addEventListener("pointercancel", off);
          c.addEventListener("pointerleave", off);
          c.addEventListener("contextmenu", (e) => e.preventDefault());
          this.btn.addEventListener("click", () => this.toggleSound());
          window.addEventListener("keydown", (e) => {
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === "m" || e.key === "M") this.toggleSound();
            else this.sound.wake();
          });
          let pending = false;
          window.addEventListener("resize", () => {
            if (pending) return;
            pending = true;
            requestAnimationFrame(() => {
              pending = false;
              this.applySize();
              if (this.still) this.renderStill();
            });
          });
          c.addEventListener("webglcontextlost", (e) => {
            e.preventDefault();
            this.lost = true;
          });
          c.addEventListener("webglcontextrestored", () => {
            this.lost = false;
            this.gpu.setTier(TIERS[this.tierName]);
            this.applySize();
            if (this.still) this.renderStill();
          });
        }

        toggleSound() {
          if (this.sound.on) {
            this.sound.disable();
            this.btn.setAttribute("aria-pressed", "false");
          } else {
            const ok = this.sound.enable(() =>
              this.loopTime(performance.now()),
            );
            this.btn.setAttribute("aria-pressed", ok ? "true" : "false");
          }
        }

        // Scene state for one frame at loop time t (shared by the live loop, still mode and tests).
        // now: wall clock seconds for the live bolts. pointer: null or {tube, cx, cy}.
        prepare(t, now = t, pointer = null) {
          const st = this.score.sample(t);
          this.segs.clear();
          this.tubes.forEach((tube, i) => {
            const glow = tube.emit(
              t,
              now,
              this.segs,
              pointer && pointer.tube === i ? pointer : null,
            );
            st.tubes[i].glow = glow;
            st.tubes[i].hot = glow;
            this.bins.set(tube.bins, i * 6);
          });
          this.gpu.renderBolts(this.segs);
          this.viewNow = this.gpu.setScene(st, this.bins);
          return st;
        }

        start() {
          if (this.still) {
            this.renderStill();
            return;
          }
          this._reanchor(START_AT); // the loop starts now, however long loading took (sound, if on, follows)
          requestAnimationFrame(this._frame);
        }

        frame(now) {
          requestAnimationFrame(this._frame);
          if (this.lost) return;
          const dtMs = this.lastNow ? Math.min(now - this.lastNow, 250) : 16.7;
          this.lastNow = now;
          const t = this.loopTime(now),
            wall = now / 1000;
          const P = this.ptr;
          const pointer = P.on ? { tube: P.tube, cx: P.cx, cy: P.cy } : null;
          this.prepare(t, wall, pointer);
          // the finger: a crack when its bolt lands, and that tube keeps singing while it stays
          this.tubes.forEach((tube, i) => {
            const L = tube.live;
            if (L && L.done && !L.struck) {
              L.struck = true;
              this.sound.zap(i, 1);
            }
            if (pointer && pointer.tube === i && L && now - P.lastHold > 150) {
              P.lastHold = now;
              this.sound.hold(i, L.done ? 1.0 : 0.3);
            }
          });
          this.gpu.renderMain(null);
          this.gpu.post((t * 13.1) % 1);
          this._growAhead(t, 2.0);
          this.frameCount++;
          this._govern(dtMs);
        }

        // Grow the soonest upcoming bolt a little each frame, so no cycle ever has to grow its tree in one go.
        _growAhead(t, budgetMs) {
          let best = null,
            bestT = 1e9;
          for (const tube of this.tubes) {
            const c = tube.pending(t);
            if (!c) continue;
            const tg = c.tg < t - 0.5 ? c.tg + LOOP_SEC : c.tg;
            if (tg < bestT) {
              bestT = tg;
              best = { tube, c };
            }
          }
          if (best) best.tube.grow(best.c, budgetMs);
        }

        // Adaptive resolution: step down fast when frames are slow, recover slowly.
        _govern(dtMs) {
          const g = this.gov,
            t = TIERS[this.tierName];
          g.ema = g.ema * 0.9 + dtMs * 0.1;
          if (g.hold > 0) {
            g.hold -= dtMs;
            return;
          }
          if (g.ema > 24) {
            g.slow += dtMs;
            g.fast = 0;
          } else if (g.ema < 17.8) {
            g.fast += dtMs;
            g.slow = 0;
          } else {
            g.slow = 0;
            g.fast = 0;
          }
          if (g.slow > 400) {
            if (g.scale > t.scaleMin + 1e-3) {
              g.scale = Math.max(t.scaleMin, g.scale * 0.87);
              this.applySize();
              g.hold = 700;
              g.slow = 0;
            } else if (g.slow > 3000) {
              const next = TIER_ORDER[TIER_ORDER.indexOf(this.tierName) + 1];
              if (next) {
                this.tierName = next;
                this.gpu.setTier(TIERS[next]);
                g.scale = TIERS[next].scaleMax * 0.85;
                this.applySize();
                g.hold = 1500;
              }
              g.slow = 0;
            }
          }
          if (g.fast > 2500 && g.scale < t.scaleMax - 1e-3) {
            g.scale = Math.min(t.scaleMax, g.scale * 1.06);
            this.applySize();
            g.hold = 1200;
            g.fast = 0;
          }
        }

        // Software renderer: one frame at the hero moment, drawn in bands so the page never stalls.
        async renderStill() {
          const token = (this.stillToken = (this.stillToken || 0) + 1);
          const idle = () => new Promise((r) => setTimeout(r, 0));
          const t = BEATS.hero;
          this.prepare(t, t, null);
          const h = this.gpu.size.mh,
            bands = 10;
          for (let i = bands - 1; i >= 0; i--) {
            this.gpu.renderMain([
              Math.floor((i * h) / bands),
              Math.floor(((i + 1) * h) / bands),
            ]);
            this.gpu.post(0.37); // show the picture as it fills in, top to bottom
            this.gpu.gl.finish();
            await idle();
            if (token !== this.stillToken) return;
          }
        }
      }

      // ===== 70_boot.js =====
      // ---------- boot ----------
      const app = new App();

      if (!TEST_MODE) {
        // compile in parallel where the browser supports it, then start
        app.gpu
          .compileAllAsync()
          .catch(() => app.gpu.compileAll())
          .then(() => app.start());
      }
    </script>
  </body>
</html>
