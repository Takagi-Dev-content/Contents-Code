      // ===== 22_color.js =====
      // ---------- from spectral lines to a color and to a chord ----------
      // CIE 1931 2-degree color matching functions, the multi-lobe fit of Wyman, Sloan and Shirley (2013).
      function cieLobe(l, mu, s1, s2) {
        const s = l < mu ? s1 : s2,
          t = (l - mu) / s;
        return Math.exp(-0.5 * t * t);
      }
      function cieXYZ(l) {
        return [
          1.056 * cieLobe(l, 599.8, 37.9, 31.0) +
            0.362 * cieLobe(l, 442.0, 16.0, 26.7) -
            0.065 * cieLobe(l, 501.1, 20.4, 26.2),
          0.821 * cieLobe(l, 568.8, 46.9, 40.5) +
            0.286 * cieLobe(l, 530.9, 16.3, 31.1),
          1.217 * cieLobe(l, 437.0, 11.8, 36.0) +
            0.681 * cieLobe(l, 459.0, 26.0, 13.8),
        ];
      }
      // Integrate the lines against the observer, convert XYZ to linear sRGB (D65). Pure lines sit outside
      // the sRGB gamut, so the mix is pulled toward white of the same luminance until nothing is negative.
      function gasColor(lines) {
        let X = 0,
          Y = 0,
          Z = 0;
        for (const [l, I] of lines) {
          if (l < 380 || l > 780) continue;
          const c = cieXYZ(l);
          X += I * c[0];
          Y += I * c[1];
          Z += I * c[2];
        }
        let r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z;
        let g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z;
        let b = 0.0557 * X - 0.204 * Y + 1.057 * Z;
        const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const m = Math.min(r, g, b);
        if (m < 0) {
          const k = -m / (L - m);
          r += k * (L - r);
          g += k * (L - g);
          b += k * (L - b);
        }
        const mx = Math.max(r, g, b, 1e-9);
        return {
          rgb: [r / mx, g / mx, b / mx],
          xy: [X / (X + Y + Z), Y / (X + Y + Z)],
        };
      }
      const lineHz = (nm) => C_LIGHT / (nm * 1e-9) / Math.pow(2, OCTAVES);

      // The chord of a gas: its strongest lines overall plus its strongest visible ones, so every voice
      // has the deep notes of the infrared it radiates most and the high notes of the light we see.
      function gasChord(lines, nAll = 10, nVis = 6) {
        const byI = lines.slice().sort((a, b) => b[1] - a[1]);
        const pick = new Map();
        for (const l of byI.slice(0, nAll)) pick.set(l[0], l[1]);
        let k = 0;
        for (const l of byI) {
          if (k >= nVis) break;
          if (l[0] > 690 || pick.has(l[0])) continue;
          pick.set(l[0], l[1]);
          k++;
        }
        const mx = Math.max(...pick.values());
        const parts = [...pick].map(([nm, I]) => ({
          nm,
          hz: lineHz(nm),
          amp: Math.pow(I / mx, 0.4),
        }));
        const sum = parts.reduce((s, p) => s + p.amp, 0);
        for (const p of parts) p.amp /= sum;
        return parts.sort((a, b) => a.hz - b.hz);
      }

        // One tube's strikes for the whole loop: entry, free texture, build-up, the tutti, waves, fade.
        // A cycle grows from tg, connects (flash) at tc and goes dark at tx. Seeds make every bolt repeatable.
        _schedule(i) {
          const rng = mulberry32(1000 + 77 * i);
          const U = (a, b) => a + (b - a) * rng();
          const out = [];
          let k = 0;
          const push = (tg, tc, tx, kind) => {
            out.push({ tg, tc, tx, kind, seed: (i + 1) * 1000 + k++ });
            return tx;
          };

            BEATS.entries[i] - 1.4,
            BEATS.entries[i],
            BEATS.entries[i] + 3.2,
            "entry",
          );
          // free texture until the build-up
          while (true) {
            const gap = U(0.7, 2.4),
              grow = U(0.45, 1.0),
              lit = U(1.1, 2.6);
            const tg = last + gap,
              tc = tg + grow;
            if (tc > 26.3) break;
            last = push(tg, tc, tc + lit, "free");
          }
          // build-up: quicker strikes, then everyone grows together into the tutti
          const tuttiG = 28.95 + 0.05 * i,
            tuttiC = BEATS.tutti + 0.06 * (i - 2);
          while (true) {
            const gap = U(0.25, 0.7),
              grow = U(0.3, 0.5),
              lit = U(0.6, 1.1);
            const tg = last + gap,
              tc = tg + grow;
            if (tc + lit > tuttiG - 0.15) break;
            last = push(tg, tc, tc + lit, "build");
          }
          last = push(tuttiG, tuttiC, tuttiC + 4.2, "tutti");
          // waves: left to right, each one a little sparser
          for (const [tw, lit] of [
            [35.4, 1.7],
            [39.6, 1.5],
            [43.9, 1.3],
            [48.1, 1.1],
          ]) {
            const tc = tw + 0.33 * i + U(-0.04, 0.04);
            last = push(
              tc - U(0.45, 0.65),
              tc,
              tc + lit + U(-0.15, 0.15),
              "wave",
            );
          }
          // fade: two short strikes, then the last one; the tubes go out left to right
          const lastOff = 56.4 + 0.6 * i;
          for (const [tMin, litA, litB] of [
            [50.9 + 0.5 * i, 0.8, 1.1],
            [53.4 + 0.4 * i, 0.6, 0.9],
          ]) {
            const tc = Math.max(tMin, last + 0.8) + U(0, 0.3);
            last = push(tc - 0.5, tc, tc + U(litA, litB), "fade");
          }
          push(
            Math.max(lastOff - 1.9, last + 0.3),
            lastOff - 1.2,
            lastOff,
            "last",
          );
          // no cycle may start before the previous one is out
          for (let k = 1; k < out.length; k++)
            if (out[k].tg < out[k - 1].tx + 0.2)
              this.problems.push(
                `tube ${i}: cycle ${k} (${out[k].kind}) starts at ${out[k].tg.toFixed(2)} before ${out[k - 1].tx.toFixed(2)}`,
              );
          return out;
        }

        // the cycle a tube is in at loop time t (the one whose glow or release still shows), else null
        cycleAt(i, t) {
          const cs = this.cycles[i];
          for (let k = cs.length - 1; k >= 0; k--) {
            const c = cs[k];
            if (t >= c.tg && t < c.tx + 1.5) return c;
          }
          return null;
        }

        // Slow channels, baked from a GSAP timeline at 120 Hz. Every channel closes on itself.
        _bakeTimeline() {
          const s = { expo: 0.9, bed: 0, vowel: 0.15, zoom: 1.0, sway: 0 };
          const tl = gsap.timeline({ paused: true });
          tl.to(s, { expo: 1.0, duration: 12, ease: "sine.inOut" }, 2)
            .to(s, { bed: 1, duration: 8, ease: "sine.inOut" }, 13)
            .to(s, { vowel: 0.45, duration: 10, ease: "sine.inOut" }, 16)
            .to(s, { zoom: 0.94, duration: 4, ease: "sine.inOut" }, 26)
            .to(
              s,
              { vowel: 1.0, expo: 1.08, duration: 1.2, ease: "power2.out" },
              29.9,
            )
            .to(s, { zoom: 1.0, duration: 6, ease: "sine.inOut" }, 31)
            .to(
              s,
              { vowel: 0.5, expo: 1.0, duration: 4, ease: "sine.inOut" },
              33,
            )
            .to(s, { bed: 0.6, duration: 8, ease: "sine.inOut" }, 40)
            .to(s, { bed: 0, vowel: 0.15, duration: 7, ease: "sine.inOut" }, 50)
            .to(s, { expo: 0.9, duration: 4, ease: "sine.inOut" }, 55.5)
            .to(s, { sway: 0, duration: 0.01 }, LOOP_SEC - 0.02);
          const n = (this.n = Math.round(LOOP_SEC * 120) + 1),
            keys = ["expo", "bed", "vowel", "zoom", "sway"];
          this.ch = {};
          for (const k of keys) this.ch[k] = new Float32Array(n);
          for (let j = 0; j < n; j++) {
            tl.seek((j / 120) % LOOP_SEC, false);
            for (const k of keys) this.ch[k][j] = s[k];
          }
        }
        value(name, t) {
          const x = (((t % LOOP_SEC) + LOOP_SEC) % LOOP_SEC) * 120,
            j = Math.min(Math.floor(x), this.n - 2),
            f = x - j;
          const a = this.ch[name];
          return a[j] + (a[j + 1] - a[j]) * f;
        }

        _buildEvents() {
          this.sounds = [];
          this.cycles.forEach((cs, i) =>
            cs.forEach((c) =>
              this.sounds.push({ kind: "strike", t: c.tc, tube: i, cycle: c }),
            ),
          );
          this.sounds.sort((a, b) => a.t - b.t);
        }

        // Glow of a tube's gas at loop time t, 0..1: a flash at the connection, a steady lit phase, a soft end.
        glow(c, t) {
          if (!c || t < c.tg) return 0;
          if (t < c.tc) return 0.03 + (0.06 * (t - c.tg)) / (c.tc - c.tg);
          if (t >= c.tx + 0.35) return 0;
          const u = t - c.tc,
            lit = c.tx - c.tc;
          const body =
            0.5 * Math.exp(-u / 0.12) + 0.5 * (1 - Math.exp(-u / 0.08));
          const tail = u < lit ? 1 : Math.exp(-(u - lit) / 0.09);
          return body * tail;
        }
        // The voice of a tube: it sings while lit (with a breath in), and fades after the glow.
        voice(i, t) {
          let v = 0;
          for (const c of this.cycles[i]) {
            for (const tt of [t, t + LOOP_SEC]) {
              // the release of the loop's last strike runs into the next loop
              if (tt < c.tg - 0.1 || tt > c.tx + 3.0) continue;
              const u = tt - c.tc;
              if (u < 0) {
                v = Math.max(v, 0.12 * smooth01(c.tg, c.tc, tt));
                continue;
              }
              const lit = c.tx - c.tc;
              const on = 1 - Math.exp(-u / 0.14);
              v = Math.max(v, u < lit ? on : on * Math.exp(-(u - lit) / 0.9));
            }
          }
          return v;
        }

        // camera: a slow sway that is centered at the tutti and closes on the loop
        camera(t) {
          const ph = (TAU * t) / LOOP_SEC;
          const zoom = this.value("zoom", t);
          return {
            x: 0.07 * Math.sin(ph) + 0.02 * Math.sin(2 * ph + 1.0),
            y: CAM.lookY + 0.02 * Math.sin(ph + 0.6),
            dist: CAM.dist * zoom,
            pitch: CAM.pitch + 0.012 * Math.sin(ph + 2.0),
            yaw: 0.05 * Math.sin(ph),
          };
        }

        sample(t) {
          return {
            t,
            expo: this.value("expo", t),
            bed: this.value("bed", t),
            vowel: this.value("vowel", t),
            cam: this.camera(t),
            tubes: GASES.map((g, i) => {
              const c = this.cycleAt(i, t);
              return {
                cycle: c,
                glow: this.glow(c, t),
                voice: this.voice(i, t),
              };
            }),
          };
        }
      }

      // ===== 30_glsl_common.js =====
      // ---------- GLSL shared by every pass ----------
      // Portability rules: no pow() of a possibly negative base, smoothstep edges always increasing,
      // atan(y,x) guarded, no normalize of a possibly zero vector, guarded divisions, NaN checks via

      const GLSL_COMMON = /* glsl */ `
precision highp float;
precision highp int;
precision highp sampler2D;
//@STRICT_HELPERS
#define PI 3.14159265
#define TAU 6.28318531
float sat(float x) { return clamp(x, 0.0, 1.0); }
vec3 sat3(vec3 x) { return clamp(x, 0.0, 1.0); }
float sqrtp(float x) { return sqrt(max(x, 0.0)); }
float powp(float x, float y) { return pow(max(x, 0.0), y); }
vec3 powp3(vec3 x, float y) { return pow(max(x, vec3(0.0)), vec3(y)); }
vec3 srgb(vec3 c) { return pow(max(c, vec3(0.0)), vec3(2.2)); }  // colors are picked in sRGB, lit in linear

vec3 nrm(vec3 v) { float l = dot(v, v); return l > 1e-24 ? v * inversesqrt(l) : vec3(0.0, 1.0, 0.0); }

bool badf(float x) { return (floatBitsToUint(x) & 0x7f800000u) == 0x7f800000u; }

vec3 ok3(vec3 v) { return vec3(okf(v.x), okf(v.y), okf(v.z)); }

float hash13(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }

}
float vnoise3(vec3 p) {
  vec3 i = floor(p); vec3 f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash13(i), b = hash13(i + vec3(1.0, 0.0, 0.0));
  float c = hash13(i + vec3(0.0, 1.0, 0.0)), d = hash13(i + vec3(1.0, 1.0, 0.0));
  float e = hash13(i + vec3(0.0, 0.0, 1.0)), g = hash13(i + vec3(1.0, 0.0, 1.0));
  float h = hash13(i + vec3(0.0, 1.0, 1.0)), k = hash13(i + vec3(1.0, 1.0, 1.0));

      // Strict GPU harness: make the undefined cases explicit NaNs, the way Metal/NVIDIA/mobile do,
      // and make isnan() useless. A correct shader renders identically either way.
      const STRICT_HELPERS = /* glsl */ `
float s_nan() { return uintBitsToFloat(0x7fc00000u); }
float sPow(float x, float y) { return x < 0.0 ? s_nan() : pow(x, y); }
vec2 sPow(vec2 x, vec2 y) { return vec2(sPow(x.x, y.x), sPow(x.y, y.y)); }
vec3 sPow(vec3 x, vec3 y) { return vec3(sPow(x.x, y.x), sPow(x.y, y.y), sPow(x.z, y.z)); }

vec4 sSmoothstep(float a, float b, vec4 x) { return a >= b ? vec4(s_nan()) : smoothstep(a, b, x); }

bvec2 sIsnan(vec2 x) { return bvec2(false); }
bvec3 sIsnan(vec3 x) { return bvec3(false); }
bvec4 sIsnan(vec4 x) { return bvec4(false); }
float sSqrt(float x) { return x < 0.0 ? s_nan() : sqrt(x); }
vec2 sSqrt(vec2 x) { return vec2(sSqrt(x.x), sSqrt(x.y)); }
vec3 sSqrt(vec3 x) { return vec3(sSqrt(x.x), sSqrt(x.y), sSqrt(x.z)); }
float sInvSqrt(float x) { return x <= 0.0 ? s_nan() : inversesqrt(x); }
float sLog(float x) { return x <= 0.0 ? s_nan() : log(x); }
vec3 sLog(vec3 x) { return vec3(sLog(x.x), sLog(x.y), sLog(x.z)); }
float sLog2(float x) { return x <= 0.0 ? s_nan() : log2(x); }
float sAcos(float x) { return abs(x) > 1.0 ? s_nan() : acos(x); }
float sAsin(float x) { return abs(x) > 1.0 ? s_nan() : asin(x); }
vec2 sNormalize(vec2 v) { return dot(v, v) == 0.0 ? vec2(s_nan()) : normalize(v); }

      function prepGLSL(src) {
        if (!STRICT_GPU) return src.replace("//@STRICT_HELPERS", "");
        const renamed = src
          .replace(/\bpow\s*\(/g, "sPow(")
          .replace(/\bsmoothstep\s*\(/g, "sSmoothstep(")
          .replace(/\batan\s*\(/g, "sAtan(")
          .replace(/\bisnan\s*\(/g, "sIsnan(")
          .replace(/\bsqrt\s*\(/g, "sSqrt(")
          .replace(/\binversesqrt\s*\(/g, "sInvSqrt(")
          .replace(/\blog\s*\(/g, "sLog(")
          .replace(/\blog2\s*\(/g, "sLog2(")
          .replace(/\bacos\s*\(/g, "sAcos(")
          .replace(/\basin\s*\(/g, "sAsin(")
          .replace(/\bnormalize\s*\(/g, "sNormalize(");

      // ===== 34_glsl_main.js =====
      // ---------- the picture: five glass tubes on a shelf, lit only by what is inside them ----------
      // Everything is analytic: vertical cylinders (glass, bore, caps), two planes (shelf, wall).
      // A ray that hits the glass is refracted twice (air > glass > gas), reads the lightning atlas on
      // the plane through the tube's axis that faces the camera, adds the gas glow along its chord
      // through the bore and goes on to the wall. The glass also mirrors the neighbouring tubes.
      function sceneGLSL() {
        const g = glf;
        return /* glsl */ `
#define N_TUBES 5
#define SPACING ${g(TUBE.spacing)}
#define R_OUT ${g(TUBE.rOut)}
#define R_IN ${g(TUBE.rIn)}
#define GLASS_Y0 ${g(TUBE.glassY0)}
#define GLASS_Y1 ${g(TUBE.glassY1)}
#define CAP_R ${g(TUBE.capR)}
#define CAP_H ${g(TUBE.capH)}
#define PIN_LEN ${g(TUBE.pinLen)}
#define PIN_R ${g(TUBE.pinR)}
#define SHELF_Z0 ${g(SHELF.z0)}
#define SHELF_Z1 ${g(SHELF.z1)}
#define SHELF_TH ${g(SHELF.thick)}
#define SHELF_W ${g(SHELF.wallW * 0.5)}
#define WALL_Z ${g(SHELF.wallZ)}
#define ATLAS_M 0.1
#define ETA_GLASS 1.5
`;
      }

      const GLSL_SCENE = /* glsl */ `
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform vec3 uCamR;
uniform vec3 uCamU;
uniform vec3 uCamF;
uniform vec2 uTanHalf;
uniform float uTime;
uniform vec4 uTube[5];      // x, z, gas glow 0..1, electrode heat
uniform vec3 uGasCol[5];    // linear rgb, max component 1
uniform float uBins[30];    // lightning light along each tube, 6 bins from bottom to top
uniform sampler2D uAtlas;
uniform sampler2D uHalo1;
uniform sampler2D uHalo2;
uniform sampler2D uHalo3;
uniform float uHaloK;
uniform float uAtlasLod;
out vec4 fragColor;

// roots of a vertical cylinder (center c, radius r) along the ray: t0 entry, t1 exit
bool cylRoots(vec3 ro, vec3 rd, vec2 c, float r, out float t0, out float t1) {
  vec2 o = ro.xz - c, d = rd.xz;
  float a = dot(d, d);
  t0 = 0.0; t1 = 0.0;
  if (a < 1e-9) return false;
  float b = dot(o, d), cc = dot(o, o) - r * r;
  float disc = b * b - a * cc;
  if (disc < 0.0) return false;
  float s = sqrt(disc);
  t0 = (-b - s) / a; t1 = (-b + s) / a;
  return true;
}
vec2 tubeXZ(int i) { return uTube[i].xy; }
float gasGlow(int i) { return uTube[i].z; }
vec3 gasCol(int i) { return uGasCol[i]; }

// lightning brightness read from the atlas: u across the bore 0..1, v along the glass 0..1
float boltAt(int i, float u, float v) {
  vec2 uv = vec2((float(i) + ATLAS_M + (1.0 - 2.0 * ATLAS_M) * clamp(u, 0.0, 1.0)) / 5.0, clamp(v, 0.0, 1.0));
  float core = textureLod(uAtlas, uv, uAtlasLod).r;
  float h1 = textureLod(uHalo1, uv, 0.0).r, h2 = textureLod(uHalo2, uv, 0.0).r, h3 = textureLod(uHalo3, uv, 0.0).r;
  return okf(core + 0.7 * h1 + 0.4 * h2 + uHaloK * h3);
}
// a wide, soft version for reflections and the walls of the bore
float boltSoft(int i, float u, float v) {
  vec2 uv = vec2((float(i) + ATLAS_M + (1.0 - 2.0 * ATLAS_M) * clamp(u, 0.0, 1.0)) / 5.0, clamp(v, 0.0, 1.0));
  return okf(textureLod(uHalo2, uv, 0.0).r + uHaloK * textureLod(uHalo3, uv, 0.0).r);
}

// the color a lit tube throws: gas glow plus its lightning, per bin
vec3 binLight(int i, int k) {
  float b = uBins[i * 6 + k];
  return gasCol(i) * (0.03 * gasGlow(i) + 0.006 * b);
}
// diffuse light from all tubes at P with normal N (point lights along each tube)
vec3 lightsAt(vec3 P, vec3 N) {
  vec3 sum = vec3(0.0);
  for (int i = 0; i < N_TUBES; i++) {
    if (gasGlow(i) <= 0.0005 && uBins[i * 6] + uBins[i * 6 + 1] + uBins[i * 6 + 2] + uBins[i * 6 + 3] + uBins[i * 6 + 4] + uBins[i * 6 + 5] <= 0.001) continue;
    vec2 c = tubeXZ(i);
    for (int k = 0; k < 6; k++) {
      vec3 L = vec3(c.x, GLASS_Y0 + PIN_LEN + (float(k) + 0.5) / 6.0 * (1.0 - 2.0 * PIN_LEN), c.y) - P;
      float d2 = dot(L, L);
      float nl = dot(N, L) * inversesqrt(max(d2, 1e-6));
      if (nl <= 0.0) continue;
      sum += binLight(i, k) * nl / (d2 * 6.0 + 0.03);
    }
  }
  return sum;
}
// the glow of tube j seen along direction R from P: a soft column (used for reflections)
vec3 tubeStreak(int j, vec3 P, vec3 R) {
  vec2 c = tubeXZ(j);
  float t0, t1;
  if (!cylRoots(P, R, c, R_OUT * 1.6, t0, t1) || t1 < 0.0) return vec3(0.0);
  float tm = max(0.5 * (t0 + t1), 0.0);
  vec3 Q = P + R * tm;
  float v = (Q.y - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0);
  if (v < -0.1 || v > 1.1) return vec3(0.0);
  float inside = fall(0.5, 1.0, length(Q.xz - c) / (R_OUT * 1.6));
  float b = boltSoft(j, 0.5, v);
  float ends = fall(0.0, 0.08, abs(v - 0.5) - 0.42);
  return gasCol(j) * (0.9 * gasGlow(j) + 0.35 * b) * inside * ends;
}
// tube j mirrored in a glossy surface: the glass hit along R from P, its glow and its lightning
vec3 tubeMirror(int j, vec3 P, vec3 R) {
  vec2 c = tubeXZ(j);
  float t0, t1;
  if (!cylRoots(P, R, c, R_OUT, t0, t1) || t0 < 0.0) return vec3(0.0);
  vec3 Q = P + R * t0;
  if (Q.y < 0.0 || Q.y > GLASS_Y1 + CAP_H) return vec3(0.0);
  float v = (Q.y - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0);
  if (v < 0.0 || v > 1.0) return vec3(0.004); // the caps, dark
  vec3 np = nrm(vec3(P.x - c.x, 0.0, P.z - c.y));
  float u = dot(Q - vec3(c.x, 0.0, c.y), vec3(-np.z, 0.0, np.x)) / R_IN;
  float b = boltSoft(j, u * 0.5 + 0.5, v);
  float ends = fall(0.0, 0.06, abs(v - 0.5) - 0.46);
  float across = sqrtp(1.0 - clamp(u * u, 0.0, 1.0));
  return gasCol(j) * (0.9 * gasGlow(j) * across + 0.7 * b) * ends;
}

// ---- materials
vec3 wallShade(vec3 P) {
  vec3 N = vec3(0.0, 0.0, 1.0);
  float grain = 0.9 + 0.14 * vnoise2(P.xy * 30.0) + 0.06 * vnoise2(P.xy * 140.0);
  vec3 albedo = vec3(0.22, 0.21, 0.20) * grain;
  return albedo * lightsAt(P, N) + vec3(0.0022, 0.002, 0.003);
}
vec3 shelfShade(vec3 P, vec3 rd) {
  vec3 N = vec3(0.0, 1.0, 0.0);

  float g1 = vnoise2(vec2(P.x * 6.0, P.z * 70.0)), g2 = vnoise2(vec2(P.x * 30.0 + 3.0, P.z * 300.0));
  float grain = 0.75 + 0.35 * g1 + 0.12 * g2;
  vec3 albedo = vec3(0.16, 0.10, 0.07) * grain;
  vec3 c = albedo * lightsAt(P, N);
  // glossy reflection of the tubes
  vec3 R = reflect(rd, N);
  float cosv = max(-rd.y, 0.0);
  float fres = 0.04 + 0.96 * powp(1.0 - cosv, 5.0);
  float gloss = 0.55 + 0.3 * g1;
  vec3 refl = vec3(0.0);
  for (int j = 0; j < N_TUBES; j++) refl += tubeMirror(j, P + vec3(0.0, 0.002, 0.0), R);
  c += refl * fres * gloss * 2.2;
  return c + vec3(0.001, 0.0008, 0.0006);
}
vec3 capShade(int i, vec3 P, vec3 N, vec3 rd) {
  vec3 base = vec3(0.028, 0.028, 0.03) * (0.8 + 0.2 * vnoise2(vec2(P.y * 200.0, atan2s(P.z - uTube[i].y, P.x - uTube[i].x) * 8.0)));
  vec3 c = base * (0.6 + 0.6 * lightsAt(P, N));

  for (int j = 0; j < N_TUBES; j++) if (j != i) c += tubeStreak(j, P, R) * 0.5;
  // own light leaking at the glass joint
  float dj = min(abs(P.y - CAP_H), abs(P.y - GLASS_Y1));
  c += gasCol(i) * gasGlow(i) * 0.25 * fall(0.0, 0.03, dj);
  // a dim room light so the metal reads as metal
  c += vec3(0.06) * powp(max(dot(R, nrm(vec3(0.3, 0.8, 0.55))), 0.0), 30.0);
  return c;
}

// background seen from P along rd (wall or shelf), for rays that passed through glass
vec3 backgroundFrom(vec3 P, vec3 rd) {
  float tw = rd.z < -1e-6 ? (WALL_Z - P.z) / rd.z : 1e9;
  float ts = rd.y < -1e-6 ? (0.0 - P.y) / rd.y : 1e9;
  if (ts < tw) {
    vec3 S = P + rd * ts;
    if (S.z > SHELF_Z0 && S.z < SHELF_Z1 && abs(S.x) < SHELF_W) return shelfShade(S, rd);
  }
  if (tw < 1e8) return wallShade(P + rd * tw);
  return vec3(0.0);
}

// what the glass reflects: the wall behind, the shelf below, the other tubes, a faint room light
vec3 envReflect(int i, vec3 P, vec3 R) {
  vec3 c = backgroundFrom(P, R) * 0.9;
  for (int j = 0; j < N_TUBES; j++) if (j != i) c += tubeStreak(j, P, R) * 0.8;
  // a soft window light from the upper left, so the glass has its sheen even when dark
  float hl = max(dot(R, nrm(vec3(-0.55, 0.6, 0.6))), 0.0);
  c += vec3(0.16, 0.17, 0.2) * (powp(hl, 28.0) + 0.25 * powp(hl, 5.0));
  return c;
}

// inside the glass of tube i: entered at P1 with refracted direction T1
vec3 glassShade(int i, vec3 P1, vec3 N1, vec3 rd) {
  vec2 c = tubeXZ(i);
  vec3 col = gasCol(i);
  float glow = gasGlow(i);
  float cosv = max(dot(-rd, N1), 0.0);
  float F = 0.04 + 0.96 * powp(1.0 - cosv, 5.0);
  vec3 R = reflect(rd, N1);
  vec3 outc = F * envReflect(i, P1, R);
  vec3 T1 = refract(rd, N1, 1.0 / ETA_GLASS);
  if (dot(T1, T1) < 0.5) return outc; // cannot happen from air, kept for safety
  // through the wall to the bore
  float t0, t1;
  vec3 inner = vec3(0.0);
  if (cylRoots(P1, T1, c, R_IN, t0, t1) && t0 > 0.0) {
    vec3 P2 = P1 + T1 * t0;
    vec3 N2 = nrm(vec3(P2.x - c.x, 0.0, P2.z - c.y)); // outward, faces the incoming ray
    vec3 T2 = refract(T1, N2, ETA_GLASS);
    float wallLen = t0;
    vec3 tint = vec3(0.92, 0.97, 0.95);
    vec3 absorb = powp3(tint, wallLen / 0.012);
    if (dot(T2, T2) < 0.5) {
      // total internal reflection: light trapped in the wall, the bright edge of thick glass
      inner = col * (0.35 * glow + 0.08 * boltSoft(i, 0.5, (P2.y - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0))) + envReflect(i, P2, reflect(T1, N2)) * 0.4;
      return outc + (1.0 - F) * inner * absorb;

    // across the bore
    float s0, s1;
    cylRoots(P2, T2, c, R_IN, s0, s1);
    float chord = max(s1, 0.0);
    vec3 P3 = P2 + T2 * chord;
    // the lightning lives on the plane through the axis that faces the camera
    vec3 np = nrm(vec3(uCamPos.x - c.x, 0.0, uCamPos.z - c.y));
    vec3 tg = vec3(-np.z, 0.0, np.x);
    float denom = dot(T2, np);
    float bolt = 0.0, pin = 0.0;
    vec3 pinCol = vec3(0.0);
    if (abs(denom) > 1e-5) {
      float tp = dot(vec3(c.x, 0.0, c.y) - P2, np) / denom;
      if (tp >= 0.0 && tp <= chord) {
        vec3 Q = P2 + T2 * tp;
        float u = dot(Q - vec3(c.x, 0.0, c.y), tg) / R_IN;
        float v = (Q.y - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0);
        bolt = boltAt(i, u * 0.5 + 0.5, v);
        // the electrode pins
        float endD = min(v, 1.0 - v);
        if (abs(u) * R_IN < PIN_R && endD < PIN_LEN) {
          pin = 1.0;
          float tip = fall(0.0, 0.012, PIN_LEN - endD);

        }

    // gas glow along the chord, the walls of the bore lit by the channel
    float vmid = (0.5 * (P2.y + P3.y) - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0);
    float ends = fall(0.0, 0.06, abs(vmid - 0.5) - 0.46);
    float column = glow * chord / (2.0 * R_IN) * ends;
    float wallLit = 0.12 * boltSoft(i, 0.5, (P2.y - GLASS_Y0) / (GLASS_Y1 - GLASS_Y0)) * ends;
    vec3 boltCol = mix(col, vec3(1.0), sat(bolt * 0.25)) * bolt * 1.4;
    vec3 gas = col * (column * 0.45 + wallLit) + boltCol * (1.0 - pin) + pinCol * pin;
    // on to whatever is behind the tube

  }

}

  else if (mat == 2) c = capShade(tube, P, N, rd);
  else if (mat == 3) c = shelfShade(P, rd);

}

in vec3 position;

out vec2 vP;    // pixel position

flat out vec2 vPar;

`;

in vec2 vP;
flat in vec4 vSeg;
flat in vec2 vPar;
out vec4 fragColor;
void main() {

  vec2 ab = b - a;

uniform sampler2D uSrc;

void main() {

uniform sampler2D uLow;
uniform sampler2D uCur;
uniform vec2 uLowTexel;
uniform vec2 uDstTexel;
out vec4 fragColor;
void main() {

  s += (textureLod(uLow, uv + vec2(-o.x, -o.y), 0.0).rgb + textureLod(uLow, uv + vec2(o.x, -o.y), 0.0).rgb +

uniform sampler2D uHdr;
uniform sampler2D uBloom;

uniform float uBloomK;
uniform float uExposure;

out vec4 fragColor;
vec3 aces(vec3 x) { return sat3((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14)); }
void main() {
