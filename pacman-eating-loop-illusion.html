<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacman Loop Illusion</title>
    <style>
      html {
        overflow: hidden;
        background: darkgrey;
      }

      .chocolate {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 15em;
        height: 20em;
      }

      .chocolate__piece {
        overflow: hidden;
        position: absolute;
      }
      .chocolate__piece:before {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform-origin: inherit;
        background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/2017/choco_patttern.jpg);
        background-size: 3em 4em;
        content: "";
      }

      .chocolate__piece--bottom {
        bottom: 0;
        width: 15em;
        height: 14.4em;
        transform: skewY(-0.48969rad);
        transform-origin: 100% 0;
      }
      .chocolate__piece--bottom:before {
        transform: skewY(0.48969rad);
        background-position: 50% 100%;
      }

      .chocolate__piece--morpher {
        transform: skewY(-0.48969rad);
      }
      .chocolate__piece--morpher:nth-child(2) {
        bottom: 6.4em;
        width: 9em;
        height: 9.6em;
        transform-origin: 0 100%;
        animation: ani1 3s linear infinite;
      }
      .chocolate__piece--morpher:nth-child(3) {
        right: 0;
        bottom: 14.4em;
        width: 6em;
        height: 8.8em;
        transform-origin: 100% 100%;
        animation: ani2 3s linear infinite;
      }
      .chocolate__piece--morpher:nth-child(3):before {
        transform-origin: 0 0;
      }
      .chocolate__piece--morpher:before {
        transform: skewY(0.48969rad);
      }

      .chocolate__piece--mover {
        height: 4em;
      }
      .chocolate__piece--mover:nth-child(4) {
        left: 3em;
        width: 6em;
        animation: ani3 3s linear infinite;
      }
      .chocolate__piece--mover:nth-child(5) {
        width: 3em;
        animation: ani4 3s linear infinite;
      }

      @keyframes ani1 {
        20% {
          transform: translate(0, -4em) skewY(-0.48969rad);
        }
        40%,
        100% {
          height: 10.4em;
          transform: translate(6em, -3.104em) skewY(-0.48969rad);
        }
      }
      @keyframes ani2 {
        20% {
          transform: translate(0, -12em) skewY(-0.48969rad);
        }
        40% {
          transform: translate(-9em, -12em) skewY(-0.48969rad);
        }
        60%,
        100% {
          height: 9.6em;
          transform: translate(-9em, 4.848em) skewY(-0.48969rad);
        }
      }
      @keyframes ani3 {
        20%,
        50% {
          transform: translate(-10.5em, -8em);
        }
        70%,
        100% {
          transform: translate(-3em, 0.1em);
        }
      }
      @keyframes ani4 {
        0% {
          opacity: 1;
        }
        20%,
        90% {
          transform: translate(-11.25em, -8em);
          opacity: 1;
        }
        90.01%,
        100% {
          opacity: 0;
        }
      }
      .pacman {
        position: absolute;
        bottom: 26em;
        margin: -4em 0;
        width: 8em;
        height: 8em;
        animation: pacmanmove 3s linear infinite;
      }
      .pacman:before,
      .pacman:after {
        display: block;
        width: 100%;
        height: 50%;
        background-color: yellow;
        animation: pacmanmouth 3s cubic-bezier(1, 0.01, 1, 0.01) infinite;
        content: "";
      }
      .pacman:before {
        border-radius: 50% 50% 0 0/ 100% 100% 0 0;
        transform: rotate(-60deg);
        transform-origin: 50% 100%;
        background-image:
          radial-gradient(#000000 65%, rgba(0, 0, 0, 0) 70%),
          linear-gradient(0deg, #000000 0.125em, rgba(0, 0, 0, 0) 0.125em);
        background-position:
          75% 50%,
          100% 100%;
        background-repeat: no-repeat;
        background-size:
          1em 1em,
          50% 100%;
      }
      .pacman:after {
        border-radius: 0 0 50% 50%/ 0 0 100% 100%;
        transform: rotate(60deg);
        transform-origin: 50% 0;
      }

      @keyframes pacmanmove {
        0% {
          right: 100%;
        }
        80%,
        90% {
          right: 19.5em;
        }
        100% {
          right: -8em;
        }
      }
      @keyframes pacmanmouth {
        80%,
        100% {
          transform: rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="chocolate">
      <div class="chocolate__piece chocolate__piece--bottom"></div>
      <div class="chocolate__piece chocolate__piece--morpher"></div>
      <div class="chocolate__piece chocolate__piece--morpher"></div>
      <div class="chocolate__piece chocolate__piece--mover"></div>
      <div class="chocolate__piece chocolate__piece--mover"></div>
    </div>
    <div class="pacman"></div>
  </body>
</html>
